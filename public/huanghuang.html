<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>公安晃晃麻将 · 高手训练台</title>
<style>
:root{
  --bg:#f4f2ec; --panel:#ffffff; --line:#dcd7c9; --ink:#21272b; --ink2:#5b6570; --ink3:#8a939d;
  --felt:#e6efe7; --felt2:#d7e5da; --accent:#c8892b; --accent2:#f6e7c8;
  --wan:#c0392b; --tiao:#1e7a4e; --tong:#1f5fa8; --gold:#e8b53a;
  --ok:#1e7a4e; --warn:#c0392b; --chip:#eef1f4;
  --shadow:0 1px 3px rgba(30,40,50,.10),0 4px 14px rgba(30,40,50,.06);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Source Han Sans SC",system-ui,sans-serif;
  font-size:14px;-webkit-font-smoothing:antialiased;
}
button{font-family:inherit;font-size:13px;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);
  padding:6px 12px;border-radius:7px;transition:.15s}
button:hover{background:#f7f8f9;border-color:#c3bdae}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.primary:hover{background:#b67a22}
button:disabled{opacity:.42;cursor:not-allowed}
button.big{padding:10px 22px;font-size:15px;border-radius:9px}
button.danger{background:#fff;color:var(--warn);border-color:#e7bfbf}

/* ---------- 布局 ---------- */
.app{display:flex;flex-direction:column;height:100vh;min-width:1080px}
header{display:flex;align-items:center;gap:14px;padding:10px 16px;background:var(--panel);
  border-bottom:1px solid var(--line);box-shadow:0 1px 0 rgba(0,0,0,.02);z-index:5}
header h1{font-size:17px;margin:0;letter-spacing:.5px;font-weight:700}
header .sub{font-size:12px;color:var(--ink3);margin-left:2px}
header .grow{flex:1}
main{flex:1;display:block;padding:12px;overflow:hidden}
/* 牌桌+教练包进居中容器：内容定宽 + margin auto → 整体在浏览器水平居中；窄屏可左右滚动 */
#mainInner{display:flex;gap:12px;width:fit-content;margin:0 auto;min-height:0}
#table{flex:none;display:flex;flex-direction:column;gap:8px;min-width:0;width:882px}
#coach{width:476px;flex:none;display:flex;flex-direction:column;gap:10px;overflow:hidden}

/* ---------- 牌桌 ---------- */
.board{position:relative;flex:none;width:882px;background:linear-gradient(180deg,var(--felt),var(--felt2));
  border:1px solid #cfd9d1;border-radius:14px;box-shadow:var(--shadow);
  display:grid;grid-template-columns:96px 1fr 96px;grid-template-rows:96px 1fr auto;padding:10px;gap:8px;min-height:0}
/* 其他三家手牌只实现一份：同一份 .seatInner（基准：手牌细条在左、碰/杠副露在右、名牌在上、听牌标签在下），
 * 摆到三个方位全靠 transform 旋转：
 *   对家 rotate(180°) → 副露转到屏幕左（其右手边）、牌面倒置
 *   上家(左) rotate(90°) → 副露转到屏幕下（其右手边）、牌顶朝右
 *   下家(右) rotate(-90°) → 副露转到屏幕上（其右手边）、牌顶朝左 */
.seat{display:flex;align-items:center;justify-content:center;min-width:0;min-height:0}
.seatInner{flex:none;width:620px;height:88px;box-sizing:border-box;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  background:rgba(255,255,255,.55);border:1px dashed #c4d2c8;border-radius:9px;padding:2px 6px}
.seatInner.active{border-style:solid;border-color:var(--accent);background:rgba(255,255,255,.85)}
.seatInner .who{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;line-height:16px}
.seatInner .who .dot{width:8px;height:8px;border-radius:50%}
/* 手牌细条区固定宽度并内部居中：副露出现/消失时手牌位置不动（预留副露空间） */
.seatInner .hrow{display:flex;align-items:center;justify-content:flex-start;gap:10px;flex-wrap:nowrap;
  width:100%;min-height:36px}
.seatInner .backs{display:flex;flex-wrap:nowrap;gap:2px;justify-content:center;flex:none;width:342px}
.seatInner .melds{display:flex;flex-wrap:nowrap;gap:4px;justify-content:flex-start;flex:1;min-width:0;overflow:hidden}
.zm{display:inline-flex;gap:1px;padding:1px;background:rgba(255,255,255,.72);
  border:1px solid #d9d2c0;border-radius:4px}
/* 听牌标签行永远渲染（未听牌时隐形）：预留高度 → 听牌提示出现时布局不跳动 */
.seatInner .tag{min-height:16px;font-size:11px;color:var(--ink2);background:rgba(255,255,255,.75);
  border:1px solid #cfd9d1;padding:1px 6px;border-radius:20px;line-height:14px}
.seatInner .tag.on{background:#fdeaea;border-color:#eec0c0;color:#a53434;font-weight:700}
#seatTop{grid-column:2;grid-row:1}
#seatTop .seatInner{transform:rotate(180deg)}
/* 左右家跨「顶行+中行」：旋转后的 seatInner 竖放（88×620）刚好落进 96px 侧栏 */
#seatLeft{grid-column:1;grid-row:1/3}
#seatLeft .seatInner{transform:rotate(90deg)}
#seatRight{grid-column:3;grid-row:1/3}
#seatRight .seatInner{transform:rotate(-90deg)}
#center{grid-column:2;grid-row:2;display:flex;align-items:center;justify-content:center;min-height:0}
#seatBottom{grid-column:1/4;grid-row:3;position:relative}
/* 碰/杠/过：只显示按钮（节约高度），浮在手牌区上沿（透明占位条处），不压手牌 */
.claimbox{position:absolute;right:10px;top:4px;z-index:6;display:flex;flex-direction:column;align-items:flex-end;
  background:rgba(255,255,255,.96);border:1px solid #d8cfa8;border-radius:10px;padding:4px 8px;
  box-shadow:0 4px 14px rgba(31,42,36,.15)}
.claimbox .cbtns{display:flex;gap:6px}
.claimbox .cb{font-size:14px;font-weight:700;padding:3px 13px;border-radius:8px;border:1px solid #cfd9d1;
  background:linear-gradient(180deg,#fff,#f3f6f4);color:#3b4a42;cursor:pointer;transition:transform .12s,box-shadow .12s}
.claimbox .cb:hover{transform:translateY(-1px);box-shadow:0 3px 8px rgba(31,42,36,.14)}
.claimbox .cb.adv{border-color:#7cc49a;background:linear-gradient(180deg,#f2fbf6,#e6f5ec);color:#186b43}
.claimbox .cb.sel{border-color:#1f5fa8;background:linear-gradient(180deg,#eaf2fb,#dceafa);color:#17415f;
  box-shadow:0 0 0 2px rgba(31,95,168,.28)}
.claimbox .cb.sel.adv{border-color:#186b43;background:linear-gradient(180deg,#e8f6ee,#d7f0e2);color:#0f5c34;
  box-shadow:0 0 0 2px rgba(24,107,67,.3)}
.claimbox .cb .star{font-size:10px;font-weight:700;margin-left:4px;color:#8a5f14}
.claimbox .chint{font-size:11px;color:#5b6570;line-height:1.35;text-align:right;white-space:nowrap}
/* 自摸胡弹框：与碰/杠同位置同样式，「胡」按钮红色高亮 */
.claimbox.winbox{border-color:#e0a8a8}
.claimbox .cb.win{background:linear-gradient(180deg,#fdeaea,#f9d2d2);border-color:#c0392b;color:#a53434;font-weight:800}
.claimbox .chint b.good{color:#186b43}
.claimbox .chint b.bad{color:#a53434}
.claimbox .chint .dim{color:#8a939d}

/* 手牌区上沿的透明占位条：给碰/杠/胡弹框（claimbox）留出悬浮空间，手牌与牌池位置保持稳定
 * （原来的空白提示条已按要求去除，只保留同高占位，不再显示任何边框/底色） */
.cbSpace{height:36px;flex:none}
.chip{background:var(--chip);border:1px solid var(--line);border-radius:20px;padding:2px 9px;font-size:12px;color:var(--ink2)}
/* 牌池：风车交叉布局 —— 每家出牌区基准 416 宽 × 214 深：一行 8 张（38px 牌 + 14px 缝）、
 * 共 3 行 24 张，行距 6px；各区外缘统一到池边 9px（我方区右端 = 下家区外缘 641，看起来整齐），
 * 四角由相邻两家各借用一半，互不重叠；中心 zmid 200×200 只显示牌墙数/赖子牌。牌桌固定尺寸 */
.pool{width:650px;height:650px;max-width:none;max-height:none;flex:none;margin:auto;position:relative;
  background:rgba(255,255,255,.28);border:1px dashed #bfcfc4;border-radius:12px}
.pool .t.last{outline:2px solid var(--accent);outline-offset:1px}
/* 各家出牌区只实现一份（基准朝向=你的视角：416 宽 × 214 深），四家共用同一份 HTML，
 * 绝对定位 + .pzone 旋转类摆到各自方位（布局框按视觉区中心反推），外缘统一离池边 9px：
 *   你   视觉区(225,427)-(641,641) 0°           → left:225px;top:427px
 *   对家 视觉区(9,9)-(425,223)     rotate(180°)  → left:9px;top:9px
 *   上家 视觉区(9,225)-(223,641)   rotate(90°)   → left:-92px;top:326px（布局框中心=(116,433)）
 *   下家 视觉区(427,9)-(641,425)  rotate(-90°)  → left:326px;top:110px（布局框中心=(534,217)） */
.pzone{position:absolute;width:416px;height:214px;overflow:hidden;
  background:rgba(255,255,255,.5);border:1px dashed #c4d2c8;border-radius:9px}
.pzone.rz90{transform:rotate(90deg)}
.pzone.rz180{transform:rotate(180deg)}
.pzone.rz270{transform:rotate(-90deg)}
/* 名牌条放在出牌区「外侧」短边（远离桌心），出牌从贴桌心一侧留 21px 起摆 ——
 * 最后一张牌的高亮描边不会再被名牌条压住（修复旋转区第一行高亮被遮挡的问题） */
.pzone .zhead{position:absolute;left:4px;bottom:3px;right:4px;z-index:2;height:16px;box-sizing:border-box;
  display:flex;align-items:center;gap:5px;font-size:11.5px;white-space:nowrap;overflow:hidden;
  background:rgba(255,255,255,.55);border-radius:6px;padding:0 4px}
.pzone .zhead .dot{width:7px;height:7px;border-radius:50%;flex:none}
.pzone .zhead b{font-weight:700}
.pzone .zt{font-size:9.5px;background:#fdeaea;border:1px solid #eec0c0;color:#a53434;border-radius:8px;padding:0 4px;line-height:14px}
.pzone .zscore{margin-left:auto;font-size:11px;font-weight:700}
/* 横缝 14px：8 张恰铺满 404px 内宽、9 张放不下 → 每行固定 8 张；行距 6px，三行之间留出间隙 */
.pzone .ztiles{position:absolute;left:4px;right:4px;top:20px;bottom:20px;
  display:flex;flex-wrap:wrap;gap:6px 14px;align-content:flex-start;align-items:flex-start;overflow:auto;
  padding:4px 2px 0;scrollbar-width:none;-ms-overflow-style:none}
.pzone .ztiles::-webkit-scrollbar{display:none}
/* 出牌区里的赖子角标和最后一张高亮都不外溢，避免首行被裁切显示不全 */
.pzone .t.laizi:after{top:1px;right:1px;font-size:8px;padding:1px 2px;border-radius:3px}
.pzone .t.last{outline-offset:0}
.pzone .zempty{font-size:10.5px;color:#a9b4ad}
.zmid{position:absolute;left:225px;top:225px;width:200px;height:200px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  border-radius:10px;background:rgba(255,255,255,.35)}
.zlai{display:flex;align-items:center;gap:3px}

/* ---------- 麻将牌 ---------- */
.t{width:34px;height:46px;background:linear-gradient(180deg,#fffefb,#f6f2e7);border:1px solid #d3ccba;
  border-radius:5px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  box-shadow:0 1px 0 #bdb6a4,0 2px 4px rgba(0,0,0,.06);user-select:none;flex:none;position:relative}
.t .n{font-size:19px;font-weight:800;line-height:1;font-family:"Georgia","Songti SC",serif}
.t .s{font-size:11px;margin-top:2px;line-height:1}
.t .face{width:100%;height:100%;display:block}
.t .n,.t .s{display:none}
.t.laizi{background:linear-gradient(180deg,#fff8e2,#fdefc9);border-color:var(--gold);box-shadow:0 1px 0 #d9b46a,0 0 0 1px #f0d68a inset}
.t.laizi:after{content:"赖";position:absolute;top:-6px;right:-5px;background:var(--gold);color:#5b4300;
  font-size:9px;line-height:1;padding:2px 3px;border-radius:4px;font-weight:700}
.t.sm{width:24px;height:33px;border-radius:4px;padding:1.5px}
.t.dc{width:38px;height:52px;border-radius:5px;padding:2px}   /* 牌池弃牌：加宽出牌区后牌面加大，字更易辨认 */
.t.lg{width:44px;height:60px}
.t.md{width:38px;height:51px;border-radius:5px;padding:2px}
.t.back{background:repeating-linear-gradient(135deg,#3f7f5f,#3f7f5f 4px,#376f52 4px,#376f52 8px);
  border-color:#2c5c43;box-shadow:0 1px 0 #244c37}
.t.back .n,.t.back .s{display:none}
.t.mini{width:24px;height:32px;border-radius:3px;padding:1px}
.t.vs{width:16px;height:22px;border-radius:3px;padding:1px}
.t.back .face{display:none}
/* 俯视(顶视)平放牌：去掉站立牌的底部厚度感，四周均匀落影 */
.t.flat{box-shadow:0 1px 3px rgba(31,42,36,.24)}
/* 未出的立牌只露顶面：象牙色细条，看不到背面花纹。
 * 基准朝向=横条(顶边东西向)；左右家的竖条靠 .seatInner 整体旋转得到 */
.t.ttop{background:linear-gradient(180deg,#fffdf4,#efe7d2);border:1px solid #cfc7b0;
  box-shadow:0 1px 2px rgba(31,42,36,.28)}
.t.ttop.h{width:22px;height:13px;border-radius:3px}

/* 我的手牌：永不换行，宽度由 JS 按张数自适应（--tw），高度固定 → 摸牌/别人摸牌都不跳动 */
.myhand{display:flex;gap:5px;align-items:flex-end;justify-content:center;flex-wrap:nowrap;
  padding:4px 0;height:92px;overflow:visible;user-select:none;-webkit-user-select:none}
/* 槽位宽度锁定为牌宽：上方的「★推荐/你选的」角标再宽也不撑大布局，14 张牌不会超出区域 */
.myhand .slot{display:flex;flex-direction:column;align-items:center;gap:3px;flex:none;width:var(--tw,44px)}
.myhand .t{cursor:pointer}
/* 选中出牌时让「牌+选中框」整体上移：lift 移到容器 .hb（内含牌和 markBox 边框），选中框随牌一起动 */
.myhand .slot .hb{transition:transform .12s,box-shadow .12s}
.myhand .slot .hb:hover{transform:translateY(-6px);box-shadow:0 6px 14px rgba(0,0,0,.16)}
.myhand .t.lg{width:var(--tw,44px);height:calc(var(--tw,44px)*1.364)}
.myhand .slot.drawn .t{outline:none}
.myhand .slot .rec{position:relative;top:-10px;font-size:10px;color:#8a5f14;background:var(--accent2);border:1px solid var(--accent);
  border-radius:8px;padding:0 5px;line-height:15px;white-space:nowrap;max-width:none}
.myhand .slot .sp{height:15px}
/* 确认阶段：牌上方徽标本身就是「出牌」按钮（点一下打出去） */
.myhand .slot .rec.act{position:relative;z-index:3;cursor:pointer;box-shadow:0 1px 4px rgba(31,42,36,.2);
  transition:transform .12s,filter .12s}
.myhand .slot .rec.act:hover{transform:translateY(-1px);filter:brightness(1.06)}
.myhand .slot .rec.act:active{transform:translateY(1px) scale(.97)}
/* 预留的摸牌空位：虚线框，尺寸与真实牌一致，摸到牌直接填入，其余牌位置不变 */
.myhand .slot .ph{width:var(--tw,44px);height:calc(var(--tw,44px)*1.364);border-radius:7px;
  display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.28)}
.myhand .slot.empty .ph{border:2px dashed #c9c0a6;animation:phBreath 1.6s ease-in-out infinite}
@keyframes phBreath{0%,100%{border-color:#c9c0a6}50%{border-color:#a89b6f}}
.myhand .slot .ph.filled{border:2px solid #c99214;background:rgba(255,255,255,.55);
  box-shadow:0 2px 6px rgba(0,0,0,.12)}
.myhand .slot .ph.filled .t{width:100%;height:100%;outline:none}
.myhand.dim .t{opacity:.55}
.myhand.dim .slot .hb:hover{transform:none;box-shadow:none}
/* 碰/杠副露：放上手牌右侧，与手牌一起水平居中（副露越多手牌越少，总宽基本不变） */
.myhand .mymelds{display:flex;align-items:center;gap:5px;flex:none;align-self:center}

/* ---------- 操作条（固定高度：文字变化不会挤压牌桌导致手牌跳动） ----------
 * 两行布局：第一行=阶段提示（你选了/教练推荐…），第二行=「你的手牌」「赖子 X 张」常驻状态 */
.actions{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;height:48px;min-height:48px;overflow:hidden}
.actions .row{display:flex;align-items:center;gap:8px;justify-content:center;flex-wrap:nowrap;max-width:100%;overflow:hidden}
.actions .msg{font-size:13px;color:var(--ink2)}
.badge{display:inline-block;padding:1px 7px;border-radius:20px;font-size:11.5px;background:var(--chip);
  border:1px solid var(--line);color:var(--ink2)}
.badge.g{background:#e6f4ec;border-color:#b6ddc6;color:#186b43}
.badge.y{background:#fdf3dc;border-color:#ecd79a;color:#8a5f14}
.badge.r{background:#fdeaea;border-color:#eec0c0;color:#a53434}

/* ---------- 教练面板 ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;min-height:0}
.card>h3{margin:0;padding:9px 12px;font-size:13.5px;border-bottom:1px solid var(--line);display:flex;
  align-items:center;gap:8px;font-weight:700}
.card>h3 .grow{flex:1}
.card .body{padding:10px 12px;overflow:auto;min-height:0}
#coachBody{font-size:13px;line-height:1.65}
.rec-head{display:flex;align-items:center;gap:10px;padding:10px 12px;background:linear-gradient(180deg,#fffaf0,#fdf3e0);
  border:1px solid #ecd79a;border-radius:10px;margin-bottom:10px}
.rec-head .big{font-size:22px;font-weight:800;color:#8a5f14}
.reason{margin:0 0 6px;padding-left:16px;position:relative}
.reason:before{content:"";position:absolute;left:4px;top:9px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.reason b{color:#8a5f14}
.reason .dim{color:var(--ink3);font-size:12px}
.sub-h{font-size:12px;color:var(--ink3);margin:10px 0 5px;font-weight:600;letter-spacing:.4px}
table.cand{width:100%;border-collapse:collapse;font-size:12.5px}
table.cand th,table.cand td{padding:5px 6px;border-bottom:1px solid #efece4;text-align:right;white-space:nowrap}
table.cand th{color:var(--ink3);font-weight:600;font-size:11.5px;text-align:right}
table.cand td:first-child,table.cand th:first-child{text-align:left}
table.cand tr.top td{background:#fffaf0}
table.cand tr.mine td{background:#eaf4ee}
.grid27{display:grid;grid-template-columns:repeat(9,1fr);gap:3px}
.g27{padding:3px 0;text-align:center;border:1px solid var(--line);border-radius:5px;font-size:11px;background:#fbfaf7}
.g27 .c{font-size:12px;font-weight:700}
.g27.zero{opacity:.35}
.g27.lz{background:#fdf3dc;border-color:var(--gold)}
.g27.hot{background:#eaf4ee;border-color:#b6ddc6}
.suitrow{display:flex;align-items:center;gap:4px;margin-bottom:4px}
.suitrow .lb{width:16px;font-size:12px;color:var(--ink3)}

/* ---------- 弹窗 ---------- */
.mask{position:fixed;inset:0;background:rgba(24,30,34,.42);display:none;align-items:center;justify-content:center;z-index:50}
.mask.on{display:flex}
.modal{background:var(--panel);border-radius:14px;width:min(880px,92vw);max-height:86vh;display:flex;flex-direction:column;
  box-shadow:0 20px 60px rgba(0,0,0,.28)}
.modal header{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal header h2{margin:0;font-size:16px;flex:1}

<body>
<div class="app">
  <header>
    <h1>公安晃晃麻将 <span class="sub">· 高手训练台</span></h1>

    <button id="btnAutoTing" title="仅当前局：听牌后托管，摸什么打什么，直到摸胡/杠/碰">听牌托管</button>

  </header>

  <main>

    </div>

    <div id="coach">
      <div class="card" style="flex:none">
        <h3>🎯 出牌教练 <span class="grow"></span><span class="badge y" id="coachLevel">详细讲解</span></h3>
        <div class="body" id="coachBody" style="max-height:46vh"></div>
      </div>
      <div class="card" style="flex:1">
        <h3>📊 候选对比 & 牌池剩余</h3>

    </div>

<div class="mask" id="mask"><div class="modal">
  <header><h2 id="mdTitle">标题</h2><button onclick="UI.closeModal()">关闭 ✕</button></header>
  <div class="mb" id="mdBody"></div>
  <footer id="mdFoot"></footer>
</div></div>
<div class="notice" id="notice"></div>

<script>
/* =============================================================
 * 公安晃晃麻将 · 核心引擎 core.js
 * 牌编码: 0-8 = 万1-9, 9-17 = 条1-9, 18-26 = 筒1-9
 * 规则要点: 万条筒108张 / 可碰可杠 / 不能吃 / 只能自摸 / 有赖子
 * ============================================================= */
(function (global) {
  'use strict';

  var N = 27;
  var SUITS = ['万', '条', '筒'];
  function suitOf(t) { return (t / 9) | 0; }
  function numOf(t) { return t % 9 + 1; }
  function tileName(t) { return numOf(t) + SUITS[suitOf(t)]; }
  function T(s, n) { return s * 9 + (n - 1); }
  function isLaizi(t, lt) { return t === lt; }

  /* ---------------- 手牌 -> 计数 ---------------- */
  function splitCounts(hand, lt) {
    var c = new Array(27), i;
    for (i = 0; i < 27; i++) c[i] = 0;
    var L = 0;
    for (i = 0; i < hand.length; i++) {
      if (hand[i] === lt) L++; else c[hand[i]]++;
    }
    return { c: c, L: L };
  }

  /* ---------------- 向听数（含赖子） ----------------
   * 公式: shanten = 8 - 2*面子 - 搭子(含将牌对子)
   * 约束: 面子+搭子 <= 5；若 ==5 且无对子做将，则 +1
   * 赖子(L张) 可在任意位置充当缺失牌，DFS 中直接枚举
   * ------------------------------------------------ */
  var _shCache = new Map();
  function shantenStd(counts, L, meldCount) {
    var c = counts.slice();
    var memo = new Map();
    var mm = meldCount || 0;

    function enc(i, L, m, t, p, ci, c1, c2) {
      return (((((((i * 5 + L) * 5 + m) * 6 + t) * 2 + p) * 5 + ci) * 5 + c1) * 5 + c2);
    }

    function go(i, L, m, t, pair) {
      // 注意：手里还有赖子时不能跳过空牌位 —— 赖子可以补在顺子/搭子的开头
      while (i < N && c[i] === 0 && L === 0) i++;
      if (i >= N) {
        var best = 8 - 2 * m - t;
        if (m + t === 5 && !pair) best += 1;
        // 剩余赖子单独成将 / 成刻
        if (L >= 2 && !pair && m + t < 5) {
          var b2 = 8 - 2 * m - (t + 1);
          if (b2 < best) best = b2;
        }
        if (L >= 3 && m < 4 && m + t < 5) {
          var b3 = 8 - 2 * (m + 1) - t;
          if ((m + 1 + t) === 5 && !pair) b3 += 1;
          if (b3 < best) best = b3;
        }
        return best;
      }
      var ci = c[i], c1 = c[i + 1] || 0, c2 = c[i + 2] || 0;
      var key = enc(i, L, m, t, pair ? 1 : 0, ci, c1, c2);
      var hit = memo.get(key);
      if (hit !== undefined) return hit;
      var best = 99, v;
      var n = i % 9;

      // 1) 全部弃掉
      c[i] = 0; v = go(i + 1, L, m, t, pair); c[i] = ci;
      if (v < best) best = v;

      if (m + t < 5) {
        // 2) 对子（搭子/将）
        if (ci >= 2) { c[i] = ci - 2; v = go(i, L, m, t + 1, true); c[i] = ci; if (v < best) best = v; }
        if (ci >= 1 && L >= 1) { c[i] = ci - 1; v = go(i, L - 1, m, t + 1, true); c[i] = ci; if (v < best) best = v; }
      }
      if (m < 4 && m + t < 5) {
        // 3) 刻子
        if (ci >= 3) { c[i] = ci - 3; v = go(i, L, m + 1, t, pair); c[i] = ci; if (v < best) best = v; }
        if (ci >= 2 && L >= 1) { c[i] = ci - 2; v = go(i, L - 1, m + 1, t, pair); c[i] = ci; if (v < best) best = v; }
        if (ci >= 1 && L >= 2) { c[i] = ci - 1; v = go(i, L - 2, m + 1, t, pair); c[i] = ci; if (v < best) best = v; }
      }
      if (n <= 6 && m + t < 5) {
        var j = i + 1, k = i + 2;
        var cj = c[j], ck = c[k];
        // 4) 顺子
        if (m < 4) {
          if (ci > 0 && cj > 0 && ck > 0) {
            c[i] = ci - 1; c[j] = cj - 1; c[k] = ck - 1;
            v = go(i, L, m + 1, t, pair);
            c[i] = ci; c[j] = cj; c[k] = ck; if (v < best) best = v;
          }
          if (L >= 1) {
            if (cj > 0 && ck > 0) { c[j] = cj - 1; c[k] = ck - 1; v = go(i, L - 1, m + 1, t, pair); c[j] = cj; c[k] = ck; if (v < best) best = v; }
            if (ci > 0 && ck > 0) { c[i] = ci - 1; c[k] = ck - 1; v = go(i, L - 1, m + 1, t, pair); c[i] = ci; c[k] = ck; if (v < best) best = v; }
            if (ci > 0 && cj > 0) { c[i] = ci - 1; c[j] = cj - 1; v = go(i, L - 1, m + 1, t, pair); c[i] = ci; c[j] = cj; if (v < best) best = v; }
          }
          if (L >= 2) {
            if (ci > 0) { c[i] = ci - 1; v = go(i, L - 2, m + 1, t, pair); c[i] = ci; if (v < best) best = v; }
            if (cj > 0) { c[j] = cj - 1; v = go(i, L - 2, m + 1, t, pair); c[j] = cj; if (v < best) best = v; }
            if (ck > 0) { c[k] = ck - 1; v = go(i, L - 2, m + 1, t, pair); c[k] = ck; if (v < best) best = v; }
          }
        }
        // 5) 两面/边张搭子
        if (ci > 0 && cj > 0) { c[i] = ci - 1; c[j] = cj - 1; v = go(i, L, m, t + 1, pair); c[i] = ci; c[j] = cj; if (v < best) best = v; }
        if (L >= 1) {
          if (ci > 0) { c[i] = ci - 1; v = go(i, L - 1, m, t + 1, pair); c[i] = ci; if (v < best) best = v; }
          if (cj > 0) { c[j] = cj - 1; v = go(i, L - 1, m, t + 1, pair); c[j] = cj; if (v < best) best = v; }
        }
        // 6) 嵌张搭子
        if (ci > 0 && ck > 0) { c[i] = ci - 1; c[k] = ck - 1; v = go(i, L, m, t + 1, pair); c[i] = ci; c[k] = ck; if (v < best) best = v; }
        if (L >= 1) {
          if (ci > 0) { c[i] = ci - 1; v = go(i, L - 1, m, t + 1, pair); c[i] = ci; if (v < best) best = v; }
          if (ck > 0) { c[k] = ck - 1; v = go(i, L - 1, m, t + 1, pair); c[k] = ck; if (v < best) best = v; }
        }
      }
      memo.set(key, best);
      return best;
    }
    return go(0, L, mm, 0, false);
  }

  /* 七对向听（无副露时） */
  function shanten7(counts, L) {
    var pairs = 0, singles = 0, i;
    for (i = 0; i < N; i++) {
      pairs += (counts[i] / 2) | 0;   // 4 张算 2 对
      singles += counts[i] % 2;       // 三张里的那张单牌也算孤张
    }
    var left = L, p = pairs;
    var u = Math.min(left, singles);
    p += u; left -= u;
    p += Math.floor(left / 2);
    return 6 - p;
  }

  /** 综合向听数。本玩法只有一种胡牌型：4 组面子（顺子或刻子）+ 1 对将，没有七对 */
  function shanten(hand, lt, melds) {
    var key = hand.slice().sort(function (a, b) { return a - b; }).join(',') + '|' + lt + '|' + (melds || 0);
    var hit = _shCache.get(key);
    if (hit !== undefined) return hit;
    var sc = splitCounts(hand, lt);
    var s = shantenStd(sc.c, sc.L, melds || 0);
    if (_shCache.size > 60000) _shCache.clear();
    _shCache.set(key, s);
    return s;
  }

  function isWin(hand, lt, melds) { return shanten(hand, lt, melds) === -1; }

  /* ---------------- 赖子个数限制（屁胡最多 1 张，大胡不限） ----------------
   * laiziLimit: 'ping' = 屁胡限 1 张、大胡不限（公安/荆州常见，默认）
   *             'all'  = 无论什么牌型都最多 1 张
   *             'none' = 不限制
   */
  var RULES = { laiziLimit: 'ping', maxLaizi: 1 };

  function isQingyise(hand, meldsArr, lt) {
    var suits = [0, 0, 0], i;
    for (i = 0; i < hand.length; i++) if (hand[i] !== lt) suits[suitOf(hand[i])]++;
    if (meldsArr) for (i = 0; i < meldsArr.length; i++) {
      if (meldsArr[i].tile !== lt) suits[suitOf(meldsArr[i].tile)]++;
    }
    var used = 0;
    for (i = 0; i < 3; i++) if (suits[i] > 0) used++;
    return used <= 1;
  }

  /** 完整胡牌判定（本玩法只有 1 种牌型，赖子限制没有大胡例外）
   * @returns {win, laizi, types[], blocked}
   */
  function checkWin(hand, meldsArr, lt, opts) {
    opts = opts || {};
    var meldCount = meldsArr ? meldsArr.length : 0;
    var sc = splitCounts(hand, lt);
    var win0;
    if (opts.noSoft) {
      // 「胡牌至少2元」规则：没出过赖子时，赖子不能当任意牌 —— 只能硬胡（赖子当本身牌面）
      var c2 = sc.c.slice(); c2[lt] += sc.L;
      win0 = (shantenStd(c2, 0, meldCount) === -1);
    } else {
      win0 = (shantenStd(sc.c, sc.L, meldCount) === -1);
    }
    if (!win0) {
      return { win: false, laizi: sc.L, types: [], blocked: false };
    }
    var types = [];
    // 本玩法没有「杠上开花」（杠后补的牌胡了就是普通自摸，不加番）
    if (opts.lastTile) types.push('海底捞月');
    var ok = (RULES.laiziLimit === 'none') || (sc.L <= RULES.maxLaizi);
    return { win: ok, laizi: sc.L, types: types, blocked: !ok };
  }

  /** 当前这手牌实际能胡哪些牌（已考虑赖子限制） */
  function winningTiles(hand, meldsArr, lt, opts) {
    var out = [];
    for (var t = 0; t < N; t++) {
      if (checkWin(hand.concat([t]), meldsArr, lt, opts).win) out.push(t);
    }
    return out;
  }

  /** 手上赖子是否超了（本玩法没有大胡，超了就只能打掉 / 拿去开杠） */
  function laiziStatus(hand, meldsArr, lt) {
    var sc = splitCounts(hand, lt);
    return { over: RULES.laiziLimit !== 'none' && sc.L > RULES.maxLaizi, laizi: sc.L, bigPossible: false };
  }

  /* ---------------- 有效进张 ---------------- */
  function relevantTiles(hand, lt) {
    var set = {}, i, j;
    for (i = 0; i < hand.length; i++) {
      var s = suitOf(hand[i]), n = numOf(hand[i]);
      for (j = n - 2; j <= n + 2; j++) {
        if (j >= 1 && j <= 9) set[T(s, j)] = 1;
      }
    }
    set[lt] = 1;
    var out = [];
    for (var k in set) out.push(+k);
    return out;
  }

  /**
   * 计算某手牌（打完一张后的 3k+1 张）的有效进张
   * ctx.unseen: Array(27) 未见张数, ctx.unseenLaizi: 未见赖子数
   */
  function ukeire(hand, lt, melds, ctx) {
    var base = shanten(hand, lt, melds);
    var cands = relevantTiles(hand, lt);
    var detail = [], total = 0, totalRaw = 0;
    for (var i = 0; i < cands.length; i++) {
      var t = cands[i];
      var raw = (t === lt) ? ctx.unseenLaizi : ctx.unseen[t];
      if (raw <= 0) continue;
      var h2 = hand.concat([t]);
      var s2 = shanten(h2, lt, melds);
      if (s2 < base) {
        // 摸到就能胡，但赖子超了（且不是大胡）→ 属于胡不了的假进张
        if (s2 === -1 && !checkWin(h2, ctx.meldsArr || null, lt, ctx.opts).win) continue;
        var w = wallEstimate(ctx, t, raw);
        detail.push({ tile: t, raw: raw, wall: w, laizi: t === lt });
        total += w; totalRaw += raw;
      }
    }
    detail.sort(function (a, b) { return b.wall - a.wall; });
    return { shanten: base, tiles: detail, total: total, totalRaw: totalRaw, kinds: detail.length };
  }

  /**
   * 牌墙中还有多少张 t —— 用「未见张数 - 预估他家持有」推断
   * 依据：各家弃牌（不要某门 → 该门在牌墙里更多）、副露（某门已消耗）
   */
  function wallEstimate(ctx, t, raw) {
    if (!ctx.opponents || !ctx.opponents.length) return raw;
    var held = 0, tu = ctx.totalUnseen || 1;
    for (var i = 0; i < ctx.opponents.length; i++) {
      var op = ctx.opponents[i];
      var share = raw * (op.handCount / tu);
      share *= opFactor(op, t, ctx.laiziType);
      held += share;
    }
    var w = raw - held;
    if (w < 0) w = 0;
    return w;
  }

  function opFactor(op, t, lt) {
    if (t === lt) return 1;
    var f = 1, s = suitOf(t);
    var dsuit = op.suitDiscard ? (op.suitDiscard[s] || 0) : 0;
    if (dsuit >= 4) f *= 0.35;
    else if (dsuit >= 3) f *= 0.5;
    else if (dsuit >= 2) f *= 0.75;
    if (op.suitMeld && op.suitMeld[s]) f *= 1.2;
    if (op.discarded && op.discarded[t]) f *= 0.7;
    if (f < 0.2) f = 0.2;
    if (f > 1.6) f = 1.6;
    return f;
  }

  /* ---------------- 番型潜力 ---------------- */
  function suitProfile(hand, lt) {
    var sc = splitCounts(hand, lt);
    var cnt = [0, 0, 0], i;
    for (i = 0; i < N; i++) cnt[suitOf(i)] += sc.c[i];
    var total = cnt[0] + cnt[1] + cnt[2] + sc.L;
    var max = Math.max(cnt[0], cnt[1], cnt[2]);
    var best = cnt[0] >= cnt[1] ? (cnt[0] >= cnt[2] ? 0 : 2) : (cnt[1] >= cnt[2] ? 1 : 2);
    return { counts: cnt, total: total, max: max, main: best, laizi: sc.L };
  }

  function pairCount(hand, lt) {
    var sc = splitCounts(hand, lt), p = 0, i;
    for (i = 0; i < N; i++) if (sc.c[i] >= 2) p++;
    return { pairs: p, laizi: sc.L };
  }

  /* ---------------- 出牌评估（提示 + AI 共用） ---------------- */
  function removeOne(hand, t) {
    var i = hand.indexOf(t);
    var h = hand.slice();
    if (i >= 0) h.splice(i, 1);
    return h;
  }

  /**
   * @returns [{discard, shanten, outs, outsRaw, detail, score, fan:{...}, note:[]}]
   */
  function evaluateDiscards(hand, lt, melds, ctx) {
    var uniq = [];
    var seen = {};
    var i;
    for (i = 0; i < hand.length; i++) {
      if (!seen[hand[i]]) { seen[hand[i]] = 1; uniq.push(hand[i]); }
    }
    var list = [];
    for (i = 0; i < uniq.length; i++) {
      var d = uniq[i];
      if (d === lt && ctx.noDiscardLaizi) continue;
      var h2 = removeOne(hand, d);
      var uk = ukeire(h2, lt, melds, ctx);
      var sp = suitProfile(h2, lt);
      var pc = pairCount(h2, lt);
      var fan = 1, tags = [];
      // 硬胡（胡牌时手上没有赖子）
      var ying = pc.laizi === 0 ? 1 : (pc.laizi === 1 ? 0.4 : 0);

      // 本玩法只有「4 面子 + 1 将」，没有清一色/碰碰胡/七对等番型，
      // 所以唯一要考虑的附加价值就是「硬胡」（不用赖子）
      var potential = 1 + 0.12 * ying;
      var score = -uk.shanten * 1000 + uk.total * potential * 10;
      // 赖子超数就永远胡不了：必须打掉，或者拿去开（赖子皮）杠
      var lz = laiziStatus(h2, ctx.meldsArr || null, lt);
      var laiziPen = lz.over ? 420 : 0;
      score -= laiziPen;
      if (lz.over) tags.push('赖子超数');
      // 听牌后看重能不能硬胡
      if (uk.shanten <= 0) score += (ying >= 1 ? 6 : 0);
      // 孤张幺九优先（同等条件下早打生张少留孤张）
      // 打出的牌被碰风险（只能自摸，风险低，仅轻微惩罚）
      var risk = pongRisk(ctx, d);
      score -= risk * 4;

      list.push({
        discard: d,
        shanten: uk.shanten,
        outs: uk.total,
        outsRaw: uk.totalRaw,
        detail: uk.tiles,
        score: score,
        potential: potential,
        risk: risk,
        fan: { ying: ying },
        tags: tags, laiziOver: lz.over, laiziBig: lz.bigPossible, laiziPen: laiziPen,
        suitProfile: sp,
        pairs: pc.pairs,
        laiziLeft: pc.laizi
      });
    }
    list.sort(function (a, b) {
      if (b.score !== a.score) return b.score - a.score;
      return a.discard - b.discard;
    });
    return list;
  }

  /* 被碰概率粗估：未见 >=2 张时，某家持有对子的可能性 */
  function pongRisk(ctx, t) {
    if (t === ctx.laiziType) return 0;
    var u = ctx.unseen[t];
    if (u < 2) return 0;
    var p = 0;
    for (var i = 0; i < ctx.opponents.length; i++) {
      var op = ctx.opponents[i];
      var f = opFactor(op, t, ctx.laiziType);

  function fanValue(f) {
    return 1 + (f.qy > 0.6 ? 4 : 0) + (f.pph >= 1 ? 2 : 0) + (f.qd >= 1 ? 2 : 0) + (f.ying >= 1 ? 1 : 0);

   * 胡牌（只能自摸，三家各付）：
   *   软胡（赖子当任意牌）基数 1；硬胡（手上无赖子 / 赖子全当本身用）基数 2
   *   海底捞月 +1（本玩法**没有杠上开花**）
   *   撑赖子：只影响胡的费用，**不影响杠的钱**。
   *     付家应付 = 基数 × 2^n ，n = 胡牌那家撑的次数 + 付钱那家撑的次数
   * 杠（单独收钱，与是否胡牌无关）：
   *   明杠＝打出者一人付 3×底分；暗杠＝每家 1×底分；补杠＝每家 1×底分
   *   （本玩法**没有赖子皮杠**）

    var sc = splitCounts(hand, lt);
    var meldCount = meldsArr ? meldsArr.length : 0;
    // 硬胡判定：手上无赖子，或把赖子全当「本身牌面」（普通牌）用也能胡
    var hard;
    if (sc.L === 0) hard = true;
    else {
      var c2 = sc.c.slice(); c2[lt] += sc.L;
      hard = (shantenStd(c2, 0, meldCount) === -1);
    }
    var per = hard ? 2 : (opts.minWin2 ? 2 : 1), items = [];

  /** 撑赖子只影响胡的费用：付家应付 = 基数 × 2^n，n = 胡家撑的张数 + 付家撑的张数（杠的钱不翻） */

  /** 杠的收钱倍数（×底分）：明杠=打出者付的总额；其余=每家付 */
  function kongMultiplier(kind) {
    switch (kind) {
      case 'kong': return 3;     // 明杠（别人打的）：打出者一人付 3×底分
      case 'angang': return 1;   // 暗杠（自己摸 4 张）：每家 1×底分
      case 'jiagang': return 1;  // 补杠（碰过之后摸到第 4 张）：每家 1×底分
      default: return 1;

  function kongName(kind) {
    return { angang: '暗杠', jiagang: '补杠', kong: '明杠' }[kind] || '杠';
  }

  function canAllTriplets(counts, L, meldCount) {
    // 已副露的面子必须都是刻子/杠
    var need = 4 - meldCount;
    var c = counts.slice();
    var memo = new Map();
    function go(i, L, made) {
      while (i < N && c[i] === 0) i++;
      if (made > need) return false;

      var key = i * 100 + L * 10 + made;
      if (memo.has(key)) return memo.get(key);

      if (!ok && ci >= 2 && L >= 1) { c[i] = ci - 2; ok = go(i, L - 1, made + 1); c[i] = ci; }
      if (!ok && ci >= 1 && L >= 2) { c[i] = ci - 1; ok = go(i, L - 2, made + 1); c[i] = ci; }
      if (!ok && L >= 3) { ok = go(i, L - 3, made + 1); }
      if (!ok) { c[i] = 0; ok = go(i + 1, L, made); c[i] = ci; }
      memo.set(key, ok);
      return ok;
    }

    var res = false;
    for (var i = 0; i < N; i++) {

        if (go(0, L, 0)) { res = true; break; }

    var list = evaluateDiscards(hand, lt, melds, ctx);
    if (!list.length) return hand[hand.length - 1];
    if (level === 'easy') {

      var k = Math.min(list.length, Math.max(2, Math.ceil(list.length * 0.6)));
      return list[(Math.random() * k) | 0].discard;
    }
    if (level === 'normal') {
      var top = list.slice(0, Math.min(3, list.length));
      var r = Math.random();
      if (r < 0.7) return top[0].discard;
      return top[(Math.random() * top.length) | 0].discard;
    }
    return list[0].discard;
  }

  /** 是否碰：比较碰前/碰后（打最优牌后）的向听与进张 */
  function aiShouldPung(hand, lt, melds, tile, ctx, level) {
    if (tile === lt) return false;
    var cur = shanten(hand, lt, melds);
    var rest = removeOne(removeOne(hand, tile), tile);
    if (rest.length !== hand.length - 2) return false;
    var melds2 = melds + 1;
    var list = evaluateDiscards(rest, lt, melds2, ctx);
    var best = list[0];
    if (!best) return false;
    var after = best.shanten;
    if (after < cur) return true;
    if (after === cur) {

      var nowList = evaluateDiscards(hand, lt, melds, ctx);
      var nowBest = nowList[0];
      if (nowBest && best.outs > nowBest.outs * 1.05) return true;
      if (best.fan.pph >= 1 && best.shanten <= nowBest.shanten) return true;
      if (level === 'hard' && best.fan.qy > 0.6 && best.shanten <= nowBest.shanten) return true;
    }
    return false;
  }

  function aiShouldKong(hand, lt, melds, tile, ctx) {
    var cur = shanten(hand, lt, melds);
    var n = 0;
    for (var i = 0; i < hand.length; i++) if (hand[i] === tile) n++;
    if (n < 3) return false;
    var rest = hand.slice();
    var removed = 0;
    for (var j = rest.length - 1; j >= 0 && removed < 3; j--) {
      if (rest[j] === tile) { rest.splice(j, 1); removed++; }

    if (!list.length) return false;
    return list[0].shanten <= cur;
  }

    SFX.laizi();
    SFX.say('赖子，' + zhName(lt));
    toast('新局开始，本局的赖子是 <b style="color:#e23b3b">' + tn(lt) + '</b>', 2600);
  }

  function cmpTile(a, b) {
    var la = a === G.laiziType, lb = b === G.laiziType;
    if (la !== lb) return la ? -1 : 1;
    return a - b;
  }

  /* ---------------- 读牌上下文 ---------------- */
  function meldCount(p) { return p.melds.length; }

  function buildCtx(seat) {
    var me = G.players[seat], lt = G.laiziType;
    var unseen = new Array(27).fill(4);
    var i, j;
    unseen[lt] = 0;                       // 赖子牌的 4 张全部当赖子，不当普通牌
    for (i = 0; i < me.hand.length; i++) if (me.hand[i] !== lt) unseen[me.hand[i]]--;
    for (i = 0; i < 4; i++) {
      var p = G.players[i];
      for (j = 0; j < p.discards.length; j++) if (p.discards[j] !== lt) unseen[p.discards[j]]--;
      for (j = 0; j < p.melds.length; j++) {
        var m = p.melds[j];
        if (m.tile !== lt) unseen[m.tile] -= (m.type === 'kong' ? 4 : 3);
      }
    }
    if (G.laiziPi !== lt) unseen[G.laiziPi]--;   // 赖子皮已翻出，不在牌墙里

    var laiziSeen = 0;
    for (i = 0; i < me.hand.length; i++) if (me.hand[i] === lt) laiziSeen++;
    for (i = 0; i < 4; i++) {
      for (j = 0; j < G.players[i].discards.length; j++) if (G.players[i].discards[j] === lt) laiziSeen++;
      for (j = 0; j < G.players[i].melds.length; j++) if (G.players[i].melds[j].tile === lt) laiziSeen += 4;
    }
    var unseenLaizi = Math.max(0, 4 - laiziSeen);
    var totalUnseen = sum(unseen) + unseenLaizi;

    var opponents = [];
    for (i = 0; i < 4; i++) {
      if (i === seat) continue;
      var op = G.players[i];
      var sd = [0, 0, 0], sm = [0, 0, 0], dmap = {};
      for (j = 0; j < op.discards.length; j++) {
        var t = op.discards[j]; if (t === lt) continue;
        sd[MJ.suitOf(t)]++; dmap[t] = (dmap[t] || 0) + 1;
      }
      for (j = 0; j < op.melds.length; j++) {
        var mm = op.melds[j]; if (mm.tile === lt) continue;
        sm[MJ.suitOf(mm.tile)]++;
      }
      opponents.push({ seat: i, handCount: op.hand.length, suitDiscard: sd, suitMeld: sm, discarded: dmap });
    }
    return {
      laiziType: lt, unseen: unseen, unseenLaizi: unseenLaizi, totalUnseen: totalUnseen,
      opponents: opponents, noDiscardLaizi: !S.laiziDiscard, wallSize: G.wall.length,
      meldsArr: me.melds, opts: winOpts(seat)
    };
  }

  /* 该家撑过的赖子张数（打出的赖子数） */
  function chengCount(seat) {
    var c = 0, ds = G.players[seat].discards;
    for (var i = 0; i < ds.length; i++) if (ds[i] === G.laiziType) c++;
    return c;
  }
  /* 「胡牌至少2元」规则下，该家是否允许软胡（赖子当任意牌）：开过开关且没出过赖子 → 不允许 */
  function softOK(seat) {
    if (!S.minWin2) return true;
    return chengCount(seat) > 0;
  }
  /* 统一的胡牌判定 opts：附带「至少2元」规则的 noSoft 限制（没出过赖子时只能硬胡） */
  function winOpts(seat) {
    var o = { lastTile: (G.wall.length === 0) };
    if (!softOK(seat)) o.noSoft = true;
    return o;
  }

  /* ---------------- 渲染 ---------------- */
  function render() {
    var st = loadStat();
    $('hdChip').textContent = '第 ' + G.round + ' 局' +
      (st.first ? ' · 直觉命中 ' + Math.round(st.firstHit / st.first * 100) + '%' : '') +
      (st.games ? ' · 已打 ' + st.games + ' 局' : '');
    renderCenter();
    renderSeats();
    renderMy();
    renderActions();
    renderCoach();
  }

  /* ---------------- 桌面中央：各家自己的出牌区 ---------------- */
  /* 出牌区只实现一份（基准朝向=你的视角：416 宽 × 214 深、名牌靠外、出牌从贴桌心一侧起横排），
   * 四家共用同一份 HTML，靠 pos 绝对定位 + .pzone 的 rz* 旋转类摆到各自方位（风车交叉布局）：
   * 你→0°；上家(左)→+90°；对家→180°；下家(右)→-90°。出牌起始位置与改动前完全一致 */
  var ZONE_META = {
    0: { pos: 'left:225px;top:427px', label: '你', rot: '' },
    1: { pos: 'left:326px;top:110px', label: '下家', rot: ' rz270' },
    2: { pos: 'left:9px;top:9px', label: '对家', rot: ' rz180' },
    3: { pos: 'left:-92px;top:326px', label: '上家', rot: ' rz90' }
  };

  function zoneHTML(seat) {
    var p = G.players[seat], meta = ZONE_META[seat];
    /* 与其他三家完全相同的结构，不做任何按座位的特判 */
    var tiles = '';
    for (var k = 0; k < p.discards.length; k++) {
      var isLast = !!(G.lastDiscard && G.lastDiscard.seat === seat && G.lastDiscard.idx === k);
      tiles += '<div class="t dc s' + MJ.suitOf(p.discards[k]) +
        (p.discards[k] === G.laiziType ? ' laizi' : '') + (isLast ? ' last' : '') + '">' +
        faceSVG(p.discards[k], false) + '</div>';
    }
    var sc = p.score;
    return '<div class="pzone' + meta.rot + '" style="' + meta.pos +
      (seat === G.turn && !G.over ? ';border-style:solid;border-color:' + SEAT_COLOR[seat] : '') + '">' +
      '<div class="zhead"><span class="dot" style="background:' + SEAT_COLOR[seat] + '"></span><b>' + meta.label + '</b>' +
      (p.ting ? '<span class="zt">听</span>' : '') +
      '<span class="zscore" style="color:' + (sc > 0 ? '#1e7a4e' : sc < 0 ? '#c0392b' : '#8a939d') + '">' +
      (sc > 0 ? '+' : '') + sc + '分</span></div>' +
      '<div class="ztiles">' + (tiles || '<span class="zempty">还没有出牌</span>') + '</div></div>';
  }

  function renderCenter() {
    var lt = G.laiziType;
    /* 中心区只留「牌墙剩」数字和赖子牌（局数在页眉 hdChip 已有，去掉文字标签更清爽） */
    var h = '<div class="zmid">' +
      '<div style="font-size:11px;color:#5b6570">牌墙剩</div>' +
      '<div style="font-size:21px;font-weight:800;color:#17415f;line-height:1.1">' + G.wall.length + '</div>' +
      '<div class="zlai">' + tileHTML(lt, 'md', lt) + '</div></div>';
    for (var seat = 0; seat < 4; seat++) h += zoneHTML(seat);
    $('pool').innerHTML = h;
  }

  function renderSeats() {
    /* 其他三家手牌只实现一份：同一份 .seatInner HTML（手牌细条在左、副露在右、名牌在上、听牌标签在下），
     * 方位与朝向全靠 CSS transform（见 #seatTop/#seatLeft/#seatRight 的 rotate）：
     *   对家 180° → 副露在屏幕左（其右手边）、牌倒置；上家(左) +90° → 副露在屏幕下、牌顶朝右；
     *   下家(右) -90° → 副露在屏幕上、牌顶朝左。听牌标签行永远渲染（未听时隐形）预留空间 */
    var map = { 2: 'seatTop', 3: 'seatLeft', 1: 'seatRight' }, lt = G.laiziType;
    for (var key in map) {
      var seat = +key, p = G.players[seat], el = $(map[key]);
      var backs = '';
      for (var b = 0; b < p.hand.length; b++) backs += '<div class="t ttop h"></div>';
      var backsHTML = '<div class="backs">' + backs + '</div>';
      var melds = '';
      for (var m = 0; m < p.melds.length; m++) {
        var md = p.melds[m], cnt = md.type === 'kong' ? 4 : 3;
        melds += '<span class="zm">';
        for (var c = 0; c < cnt; c++) melds += tileHTML(md.tile, 'mini flat', lt);
        melds += '</span>';
      }
      var meldsHTML = melds ? '<div class="melds">' + melds + '</div>' : '';
      el.innerHTML =
        '<div class="seatInner' + (G.turn === seat && !G.over ? ' active' : '') + '">' +
        '<div class="who"><span class="dot" style="background:' + SEAT_COLOR[seat] + '"></span>' + p.name + '</div>' +
        '<div class="hrow">' + backsHTML + meldsHTML + '</div>' +
        '<div class="tag' + (p.ting ? ' on' : '') + '"' + (p.ting ? '' : ' style="visibility:hidden"') + '>听牌</div>' +
        '</div>';
    }
  }

  /* 手牌宽度自适应：以实际渲染出的槽位数量计算单张牌宽，保证 14 张也完整放进手牌区 */
  function fitMyHand() {
    try {
      var handEl = $('seatBottom').querySelector('.myhand');
      if (!handEl || !handEl.style || !handEl.style.setProperty) return;
      var n = handEl.querySelectorAll('.slot').length || 1;
      var avail = handEl.clientWidth;
      if (!(avail > 0)) avail = ($('seatBottom').clientWidth || 900);
      avail -= 8;
      var tw = Math.floor((avail - 14 - (n - 1) * 5) / n);
      tw = Math.max(20, Math.min(44, tw));
      if (!isNaN(tw)) handEl.style.setProperty('--tw', tw + 'px');
    } catch (e) { /* 无 DOM 环境（测试）时跳过 */ }
  }

  /** 碰/杠/过 & 胡/过：统一用弹框提示（节约高度），浮在自己手牌区右上角（透明占位条处），不压手牌；
   *  选中后才揭晓教练答案，再点一次才执行 */
  function claimBoxHTML() {
    // 自摸胡牌：和碰/杠走同一个弹框（胡/过）
    if (G.pending && G.pending.type === 'win') {
      var selW = G.claimSel;
      function wbtn(kind, label, winCls) {
        var isSel = (selW === kind);
        return '<button class="cb' + (isSel ? ' sel' : '') + (winCls || '') +
          '" onclick="UI.claimPick(\'' + kind + '\')">' + label + '</button>';
      }
      var wbtns = wbtn('win', '胡', ' win') + wbtn('pass', '过', '');
      return '<div class="claimbox winbox"><div class="cbtns">' + wbtns + '</div>' +
        (selW ? '<div class="chint">再点一次「' + (selW === 'win' ? '胡' : '过') + '」确认</div>' : '') + '</div>';
    }
    if (!G.pending || G.pending.type !== 'claim') return '';
    var pd = G.pending, A = (S.coach !== 'off') ? claimAdvice() : null;
    var sel = G.claimSel;
    function btn(kind, label) {
      var isSel = (sel === kind);
      // 教练答案只在「已选择、揭晓之后」才标出来，第一次选择前不泄漏
      var isAdv = !!(sel && A && A.advice === kind);
      return '<button class="cb' + (isSel ? ' sel' : '') + (isAdv ? ' adv' : '') +
        '" onclick="UI.claimPick(\'' + kind + '\')">' + label +
        (isAdv ? '<span class="star">★</span>' : '') + '</button>';
    }
    var btns = '';
    if (pd.canPung) btns += btn('pung', '碰');
    if (pd.canKong) btns += btn('kong', '杠');
    btns += btn('pass', '过');
    // 仅按钮：点一下选择（高亮），再点一次确认；不提前泄露教练建议
    return '<div class="claimbox"><div class="cbtns">' + btns + '</div>' +
      (sel ? '<div class="chint">再点一次「' + (sel === 'kong' ? '杠' : sel === 'pung' ? '碰' : '过') + '」确认</div>' : '') + '</div>';
  }

  function renderMy() {
    var me = G.players[0], lt = G.laiziType;
    var hand = me.hand.slice().sort(cmpTile);
    var drawn = me.drawn;
    var showRec = (G.phase === 'discard' && G.turn === 0 && G.hint && S.coach !== 'off' && showAnswer());
    var showRecConfirm = (G.phase === 'confirm' && G.hint && S.coach !== 'off');
    // 推荐集合：并列最优的几张牌都算教练推荐
    var recSet = {};
    if ((showRec || showRecConfirm) && G.hint.bestSet)
      for (var ri = 0; ri < G.hint.bestSet.length; ri++) recSet[G.hint.bestSet[ri]] = 1;
    var picked = (G.phase === 'confirm') ? G.pick : -1;
    // 我实际点的那张牌所在槽位（同型牌有多张时，徽标要落在我点的那一张上）
    var pickSlot = (G.phase === 'confirm' && G.pickSlot != null) ? G.pickSlot : -1;

    // 我的碰/杠副露：摆在自己手牌右侧，与手牌一起水平居中（myhand 内 justify-content:center）
    var myMelds = '';
    for (var mm = 0; mm < me.melds.length; mm++) {
      var md2 = me.melds[mm], cc2 = md2.type === 'kong' ? 4 : 3;
      myMelds += '<span class="zm">';
      for (var ck = 0; ck < cc2; ck++) myMelds += tileHTML(md2.tile, 'mini flat', lt);
      myMelds += '</span>';
    }
    var h = '<div class="cbSpace"></div><div class="myhand">';

    // 把摸到的牌分开放右边
    var body = [], drIdx = -1;
    for (var i = 0; i < hand.length; i++) {
      if (drIdx < 0 && drawn != null && hand[i] === drawn) { drIdx = i; continue; }
      body.push(hand[i]);
    }
    // mark=true 才画徽标/描边：同一种牌只标一处 ——
    // 我选中的那张优先（哪怕它不是第一张）；推荐牌则标在该牌型的第一张上
    function slot(t, isDrawn, mark, si) {
      var rec = !!recSet[t], pk = (t === picked);
      var act = (G.phase === 'confirm');    // 确认阶段：牌上方徽标就是「出牌」按钮
      var badge;
      if (!mark) {
        badge = '<div class="sp"></div>';
      } else if (act && pk && rec) {
        // 我选的正是教练最优之一 → 绿色，一眼看出「选对了」
        badge = '<div class="rec act" data-t="' + t + '" title="打出这张牌（教练最优之一）" ' +
          'style="background:#1c7a45;border-color:#14603a;color:#fff;font-weight:700;cursor:pointer">最优 · 出牌 ✓</div>';
      } else if (act && pk) {
        // 我选的不在最优答案里 → 蓝色（与最优区分开）
        badge = '<div class="rec act" data-t="' + t + '" title="打出这张牌" ' +
          'style="background:#1f5fa8;border-color:#16477f;color:#fff;font-weight:700;cursor:pointer">出牌</div>';
      } else if (act && rec) {
        badge = '<div class="rec act" data-t="' + t + '" title="打出教练推荐的这张牌" ' +
          'style="background:#fff9ec;border-color:#c99214;color:#8a5f14;font-weight:700;cursor:pointer">★ 推荐</div>';
      } else if (pk) {
        badge = '<div class="rec" style="background:#e7f0f8;border-color:#7fadd6;color:#17415f">你选的</div>';
      } else if (rec) {
        badge = '<div class="rec" style="background:#fff9ec;border-color:#e8c875;color:#8a5f14">★ 推荐</div>';
      } else badge = '<div class="sp"></div>';
      var markBox = mark ? (
        (pk ? '<div style="position:absolute;inset:-3px;border:2px solid #1f5fa8;border-radius:7px;pointer-events:none"></div>' : '') +
        (pk && rec ? '<div style="position:absolute;inset:-5px;border:2px solid #1c7a45;border-radius:9px;pointer-events:none"></div>' : '') +
        (rec && !pk ? '<div style="position:absolute;inset:-3px;border:2px solid #c99214;border-radius:7px;pointer-events:none"></div>' : '')
      ) : '';
      if (isDrawn) {
        // 摸到的牌始终落在「待摸框」里：空框（等摸）→ 填进框内（摸到），位置不跳动
        return '<div class="slot drawn">' + badge +
          '<div class="ph filled"><div class="hb" style="position:relative;width:100%;height:100%">' +
          tileHTML(t, 'lg', lt, si) + markBox + '</div></div></div>';
      }
      return '<div class="slot">' + badge +
        '<div class="hb" style="position:relative;display:flex">' + tileHTML(t, 'lg', lt, si) + markBox +
        '</div></div>';
    }
    // 槽位序列：手牌区（已排序）+ 最后摸到的那张 → 槽位号与点击时记录的 pickSlot 对应
    var seq = [];
    for (var j = 0; j < body.length; j++) seq.push({ t: body[j], drawn: false });
    if (drIdx >= 0) seq.push({ t: hand[drIdx], drawn: true });
    var markAt = {};                                   // 牌型 → 该画徽标的槽位号
    for (var k = 0; k < seq.length; k++) if (markAt[seq[k].t] === undefined) markAt[seq[k].t] = k;
    // 我点的那一张（不是第一张也照样标它）；推荐牌型 == 我选的牌型时，同样跟着我这张
    if (pickSlot >= 0 && pickSlot < seq.length && seq[pickSlot].t === picked) markAt[picked] = pickSlot;
    // 手牌区槽位先画（seq 里摸牌占最后一个序号，data-si/pickSlot 序号保持不变）
    for (var k2 = 0; k2 < body.length; k2++) h += slot(seq[k2].t, false, markAt[seq[k2].t] === k2, k2);
    // 摸牌空位：只有「等着摸牌」（13 张有效）时才预留；
    // 已经 14 张（该出牌了，比如开局摸满）就不显示，免得超出桌子
    var eff = me.hand.length + 3 * me.melds.length;    // 13=等摸 14=该出（杠算 3）
    var showPH = (drIdx < 0 && eff % 3 === 1);
    if (drIdx >= 0 || showPH) h += '<div style="width:14px;flex:none"></div>';
    // 摸到的牌画在虚线框的同一位置（分隔条之后）：虚线框消失、牌出现在原位，位置不跳动
    if (drIdx >= 0) h += slot(seq[body.length].t, true, markAt[seq[body.length].t] === body.length, body.length);
    else if (showPH) h += '<div class="slot drawn empty"><div class="sp"></div><div class="ph"></div></div>';
    // 副露放到手牌最右侧：与手牌一起被 myhand 的 justify-content:center 整体居中
    if (myMelds) h += '<div style="width:14px;flex:none"></div><div class="mymelds">' + myMelds + '</div>';
    h += '</div>';
    h += claimBoxHTML();          // 碰/杠/过 & 胡/过：弹框浮在自己手牌区右上角
    $('seatBottom').innerHTML = h;

    // 手牌尺寸固定（--tw 默认 44px，不随窗口缩放）：窗口缩放不再重算牌宽，
    // 也绝不会因缩放触发新的一局或让手牌变小。

    var nodes = $('seatBottom').querySelectorAll('.myhand .t');
    for (var n = 0; n < nodes.length; n++) {
      (function (node) {
        var tt = +node.getAttribute('data-t');
        var siAttr = node.getAttribute('data-si');
        var si = (siAttr == null ? null : +siAttr);    // 槽位号：同型牌区分我点的是哪一张
        // 左键：出牌；确认阶段 = 改选（原来「再想想 + 重新点」两步合成一步）
        node.onclick = function () {
          if (!(G.turn === 0 && (G.phase === 'discard' || G.phase === 'confirm')) || G.over) return;
          humanDiscard(tt, si);
        };
        // 右键：直接出牌（跳过确认）
        node.oncontextmenu = function (ev) {
          if (ev && ev.preventDefault) ev.preventDefault();
          if (!(G.turn === 0 && (G.phase === 'discard' || G.phase === 'confirm')) || G.over) return;
          UI.quickPlay(tt);
        };
      })(nodes[n]);
    }
    // 牌上方徽标按钮：点一下就打出这张（自己选的「出牌 ✓」/ 推荐的「★ 推荐 · 打出」）
    var badges = $('seatBottom').querySelectorAll('.myhand .rec.act');
    for (var g = 0; g < badges.length; g++) {
      (function (b) {
        b.onclick = function (ev) {
          if (ev && ev.stopPropagation) ev.stopPropagation();
          UI.quickPlay(+b.getAttribute('data-t'));
        };
      })(badges[g]);
    }
  }

  /** 这张牌是否属于教练推荐（并列最优的几张都算） */
  function inBestOf(H, t) {
    if (!H) return false;
    if (H.bestSet) { for (var i = 0; i < H.bestSet.length; i++) if (H.bestSet[i] === t) return true; return false; }
    return !!(H.best && t === H.best.discard);
  }
  /** 教练推荐的所有牌名（并列时用「、」连起来） */
  function bestNames(H) {
    var set = (H && H.bestSet && H.bestSet.length) ? H.bestSet : (H && H.best ? [H.best.discard] : []);
    var a = [];
    for (var i = 0; i < set.length; i++) a.push(tn(set[i]));
    return a.join('、');
  }
  /** 选的牌和教练推荐不同、但评分完全相同（同样好的打法） */
  function sameScore(pick) {
    if (!G.hint || !G.hint.best || pick === G.hint.best.discard) return false;
    return inBestOf(G.hint, pick);
  }

  /** 操作条第二行（常驻）：「你的手牌」+ 赖子个数 + 听牌中，显示在阶段提示（你选了/教练推荐…）下面 */
  function handChipsRow() {
    var me = G.players[0];
    var lz = MJ.laiziStatus(me.hand, me.melds, G.laiziType);
    var lzChip = lz.laizi === 0 ? '' :
      (lz.over
        ? '<span class="badge r">赖子 ' + lz.laizi + ' 张 · 屁胡超限' + (lz.bigPossible ? '，只能冲大胡' : '，必须处理') + '</span>'

  /* ---------------- 碰/杠决策教练：对还是不对，哪种赢面概率大 ---------------- */
  /** 粗估胡牌概率：每摸一张的命中率≈进张/未见牌，我方剩余摸牌≈牌墙/4，
   *  用指数衰减近似「牌墙摸完前能不能推完（向听+1）步」 */
  function estWinProb(sh, outs, unseenTotal, wallLeft) {
    if (!(outs > 0)) return 0;
    var myDraws = Math.floor(wallLeft / 4);
    if (myDraws < 1) return 0;
    var steps = Math.max(1, sh + 1);          // 听牌 0 → 还差 1 步（胡那张）
    var p = Math.min(0.9, outs / Math.max(4, unseenTotal));
    var need = steps / p;                     // 期望要摸几张
    return Math.max(0.005, Math.min(0.95, 1 - Math.exp(-myDraws / need)));
  }

  /** 计算两条路的对比：A=不碰不杠打最优 / B=碰(杠)掉再打最优 */
  function claimAdvice() {
    if (!G.pending || G.pending.type !== 'claim') return null;
    var pd = G.pending, me = G.players[0], tile = pd.tile, lt = G.laiziType;
    var ctx = buildCtx(0);
    var nowList = MJ.evaluateDiscards(me.hand, lt, me.melds.length, ctx);
    if (!nowList.length) return null;
    var nowBest = nowList[0];
    var isKong = (pd.kind === 'kong');
    var use = isKong ? 3 : 2;
    var rest = me.hand.slice(), removed = 0;
    for (var i = rest.length - 1; i >= 0 && removed < use; i--) {
      if (rest[i] === tile) { rest.splice(i, 1); removed++; }
    }
    if (removed < use) return null;
    var afterList = MJ.evaluateDiscards(rest, lt, me.melds.length + 1, ctx);
    if (!afterList.length) return null;
    var afterBest = afterList[0];

    var U = ctx.totalUnseen;
    var pA = estWinProb(nowBest.shanten, nowBest.outs, U, G.wall.length);
    var pB = estWinProb(afterBest.shanten, afterBest.outs, U, G.wall.length);
    var advice;
    if (isKong) {
      // 杠独立收钱 + 杠后补一张：只要不明显变慢就杠
      advice = (afterBest.shanten <= nowBest.shanten) ? 'kong'
        : (pB + 0.08 >= pA ? 'kong' : 'pass');
    } else {
      if (afterBest.shanten < nowBest.shanten) advice = 'pung';
      else if (afterBest.shanten > nowBest.shanten) advice = 'pass';
      else advice = (pB >= pA * 1.08 || afterBest.outs > nowBest.outs * 1.15) ? 'pung' : 'pass';
    }
    return {
      advice: advice, isKong: isKong, tile: tile,
      now: nowBest, after: afterBest, pA: pA, pB: pB,
      kongGain: S.kongPay ? S.base * 3 : 0   // 明杠：打出者一人付 3×底分
    };
  }

  function claimAdviceHTML() {
    var A = claimAdvice();
    if (!A) return '<div style="color:#8a939d">等你做决定…</div>';
    var act = A.isKong ? '杠' : '碰';
    var go = A.advice !== 'pass';
    var h = '<div class="rec-head" style="' + (go ? '' : 'background:linear-gradient(180deg,#f4f8fb,#e9f1f7);border-color:#b9d3e6') + '">' +
      '<div><div style="font-size:12px;color:' + (go ? '#8a5f14' : '#17415f') + '">教练建议</div>' +
      '<div class="big" style="' + (go ? '' : 'color:#17415f') + '">' + (go ? act : '过') + '</div></div>' +
      '<div style="flex:1;font-size:12.5px;line-height:1.7">' +
      '<b>' + tn(A.tile) + '</b> 打出来了。' +
      (go ? act + '了更划算 —— 对比数据见下。' : '不' + act + '更划算 —— ' + act + '了反而赢面更小。') +
      '</div></div>';
    h += '<div class="kv" style="margin-top:8px">' +
      '<div class="k">' + act + '，然后打 ' + tn(A.after.discard) + '</div>' +
      '<div>' + (A.after.shanten <= 0 ? '听牌' : A.after.shanten + ' 向听') +
      ' · 进张约 ' + A.after.outs.toFixed(1) + ' 张 · <b>胡牌概率约 ' + (A.pB * 100).toFixed(0) + '%</b></div>' +
      '<div class="k">过，然后打 ' + tn(A.now.discard) + '</div>' +
      '<div>' + (A.now.shanten <= 0 ? '听牌' : A.now.shanten + ' 向听') +
      ' · 进张约 ' + A.now.outs.toFixed(1) + ' 张 · <b>胡牌概率约 ' + (A.pA * 100).toFixed(0) + '%</b></div></div>';
    var rs = [];
    if (A.isKong) {
      rs.push('杠是<b>独立收钱</b>' + (A.kongGain ? '（这把就收 ' + A.kongGain + ' 分，跟胡不胡无关），杠完还从牌尾补一张' : '，杠完还从牌尾补一张') + '，只要不明显拖慢手牌就值得。');
    }
    if (A.after.shanten < A.now.shanten) {
      rs.push(act + '之后向听从 <b>' + A.now.shanten + ' → ' + A.after.shanten + '</b>，直接提速，果断' + act + '。');
    } else if (A.after.shanten > A.now.shanten) {
      rs.push(act + '之后向听从 <b>' + A.now.shanten + ' → ' + A.after.shanten + '</b>，会慢一步' +
        (A.isKong && A.advice === 'kong' ? '，但杠的钱是稳收的，这里还是建议杠' : '，不划算') + '。');
    } else if (A.after.outs > A.now.outs + 0.5) {
      rs.push('向听数一样，但' + act + '之后有效进张多 <b>' + (A.after.outs - A.now.outs).toFixed(1) + '</b> 张，每次摸牌的命中率更高。');
    } else if (A.after.outs < A.now.outs - 0.5) {
      rs.push('向听数一样，但' + act + '之后有效进张反而少 <b>' + (A.now.outs - A.after.outs).toFixed(1) + '</b> 张（这个对子拆掉了你别的搭子）。');
    } else {
      rs.push('两边数字几乎一样，' + act + '不' + act + '差别不大 —— 这种时候看桌况：对家在听牌就别送他节奏。');
    }
    rs.push('<span class="dim">概率是按「进张 ÷ 未见牌数 ≈ 每摸一张的命中率」推出来的<b>估算值</b>，方向可靠、数字仅供参考。</span>');
    for (var i = 0; i < rs.length; i++) h += '<div class="reason">' + rs[i] + '</div>';
    return h;
  }

  /* ---------------- 教练面板 ---------------- */
  function renderCoach() {
    var box = $('coachBody'), tbl = $('coachTable');

    if (!G) return;

    // 碰/杠决策：先给「对还是不对、哪种概率大」
    // 碰/杠决策：先选后看 —— 你选了之后才揭晓教练建议

    tbl.innerHTML = showTbl + remainGridHTML();
  }

  /** 思考阶段：不给答案，只给引导问题 */
  function thinkHTML() {

      '<b>先自己决定打哪张</b>，点手牌选择。选完之后教练才会揭晓答案并讲解。<br>' +
      '<span style="font-size:12px;color:#5b6570">你现在是 <b>' + (sh <= 0 ? '听牌' : sh + ' 向听') + '</b>，' +
      '目标：让打完之后「能让你变快的牌」尽量多。</span></div></div>';

    if (G.canWin) h += '<div class="hint" style="margin-top:0;background:#f0f8f3;border-left-color:#1e7a4e">你这手<b>可以胡</b> —— 右上角弹框选「胡 / 过」，先自己判断，再点一次确认。</div>';
    var _kl = (G.canKongList && G.canKongList.length) ? G.canKongList : null;

    var lz = MJ.laiziStatus(G.players[0].hand, G.players[0].melds, G.laiziType);
    if (lz.over) {
      h += '<div class="hint" style="background:#fff6f6;border-left-color:#c0392b;margin-top:0">' +
        '<b style="color:#a53434">先处理赖子：你有 ' + lz.laizi + ' 张，屁胡最多 ' + MJ.rules.maxLaizi + ' 张。</b><br>' +
        (lz.bigPossible ? '这手还有大胡（清一色/碰碰胡/七对）的机会 —— 大胡不限赖子，可以留着冲。'
          : '看不出大胡，建议<b>打掉一张赖子</b>，否则后面胡不了。') + '</div>';
    }
    h += '<div class="reason">哪几张是<b>孤张</b>（旁边没有搭子）？孤张里的 1、9 最没用。</div>';
    h += '<div class="reason">打掉它之后，<b>还有哪些牌能让我的向听数减少</b>？一共还剩几张？</div>';
    h += '<div class="reason">这些进张里，<b>牌池已经现了几张</b>？现得多的靠不住。</div>';
    h += '<div style="margin-top:10px"><button class="primary" onclick="UI.reveal()">我想不出来，直接给答案</button></div>';
    h += '<div style="font-size:11.5px;color:#8a939d;margin-top:6px">实在想不出就点上面的按钮 —— 但先自己想 10 秒，进步会快得多。</div>';
    return h;
  }

  /** 确认阶段：你选的 vs 推荐（并列最优的几张都算推荐） */
  function confirmHTML() {
    var pick = G.pick, b = G.hint.best;
    var bestSet = (G.hint.bestSet && G.hint.bestSet.length) ? G.hint.bestSet : [b.discard];
    var inBest = inBestOf(G.hint, pick);
    var same = (pick === b.discard);
    var mine = null;
    for (var i = 0; i < G.hint.list.length; i++) if (G.hint.list[i].discard === pick) mine = G.hint.list[i];
    var h = '<div class="rec-head" style="' + (inBest ? '' : 'background:linear-gradient(180deg,#fff6f6,#fdeaea);border-color:#eec0c0') + '">' +
      '<div><div style="font-size:12px;color:#5b6570">你选的</div><div class="big" style="color:#17415f">' + tn(pick) + '</div></div>' +
      '<div style="width:22px;text-align:center;color:#8a939d">→</div>' +
      '<div><div style="font-size:12px;color:#8a5f14">教练推荐' + (bestSet.length > 1 ? '（并列 ' + bestSet.length + ' 张）' : '') + '</div>' +
      '<div class="big">' + bestNames(G.hint) + '</div></div>' +
      '<div style="flex:1;font-size:12.5px;line-height:1.6;text-align:right">' +
      (inBest ? '<b style="color:#186b43">✓ 选择最优</b>' : '<b style="color:#a53434">✗ 不一样</b>') + '</div></div>';
    if (!inBest && mine) {
      var diff;
      if (mine.shanten !== b.shanten) {
        diff = '打你选的会慢 <b>' + (mine.shanten - b.shanten) + '</b> 步（' + b.shanten + ' → ' + mine.shanten + ' 向听）';
      } else {
        diff = '向听一样，但进张少 <b>' + (b.outs - mine.outs).toFixed(1) + '</b> 张（你选的 ' + mine.outs.toFixed(1) + '，推荐 ' + b.outs.toFixed(1) + '）';
      }
      h += '<div class="hint" style="margin-top:0">' + diff + '。下面解释了推荐理由，想改就直接点牌上方的「出牌 ✓」。</div>';
    } else if (inBest) {
      var outsTxt = (mine ? mine.outs : b.outs).toFixed(1);
      if (same) {
        h += '<div class="hint" style="margin-top:0;background:#f0f8f3;border-left-color:#1e7a4e">' +
          '<b style="color:#186b43">第一直觉就选对了。</b>下面的理由可以快速扫一眼 —— 重点记「为什么是它」，下次遇到类似牌型才能秒判。</div>';
      } else {
