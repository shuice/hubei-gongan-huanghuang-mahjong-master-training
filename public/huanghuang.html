      }
    }
    return h;
  }

  function coachHTML(H) {
    var names = bestNames(H);
    var tieTag = (H.bestSet && H.bestSet.length > 1) ? ' <span class="badge g">并列 ' + H.bestSet.length + ' 张</span>' : '';
    if (S.coach === 'tip') {
      return '<div class="rec-head"><div><div style="font-size:12px;color:#8a5f14">建议打</div>' +
        '<div class="big">' + names + '</div></div>' +
        '<div style="flex:1;font-size:12.5px;color:#5b6570">' + tieTag +
        (H.best.shanten <= 0 ? '打完听牌，胡 ' + H.best.detail.map(function (d) { return tn(d.tile); }).join('、') :
          '打完 ' + H.best.shanten + ' 向听，进张约 ' + H.best.outs.toFixed(1) + ' 张') + '</div></div>';
    }
    var h = '<div class="rec-head"><div><div style="font-size:12px;color:#8a5f14">建议打</div>' +
      '<div class="big">' + names + '</div></div>' +
      '<div style="flex:1;font-size:12.5px;color:#5b6570;line-height:1.6">' + tieTag +
      (H.best.shanten <= 0 ? '打完即可<b>听牌</b>' : '打完 <b>' + H.best.shanten + ' 向听</b>') +
      '<br>有效进张约 <b>' + H.best.outs.toFixed(1) + '</b> 张</div></div>';
    var rs = buildReasons(H);
    for (var i = 0; i < rs.length; i++) h += '<div class="reason">' + rs[i] + '</div>';
    if (H.best.tags.length) {
      h += '<div style="margin-top:8px">' + H.best.tags.map(function (t) { return '<span class="badge y">' + t + '可能</span>'; }).join(' ') + '</div>';
    }
    return h;
  }

  function buildReasons(H) {
    var b = H.best, ctx = H.ctx, r = [], i;
    var me = G.players[0], lt = G.laiziType;
    var L = 0;
    for (i = 0; i < me.hand.length; i++) if (me.hand[i] === lt) L++;

    // 1. 结论与向听
    if (b.shanten <= 0) {
      var tl = b.detail.slice(0, 10).map(function (d) { return tn(d.tile) + (d.laizi ? '(赖)' : ''); }).join('、');
      r.push('打掉 <b>' + tn(b.discard) + '</b> 就<b>听牌</b>了，听 ' + tl + '。');
    } else {
      r.push('打掉 <b>' + tn(b.discard) + '</b> 后是 <b>' + b.shanten + ' 向听</b>（再摸 ' + b.shanten + ' 张有效牌就能听牌）。');
    }

    // 2. 有效进张
    if (b.detail.length) {
      var s = b.detail.slice(0, 8).map(function (d) { return tn(d.tile) + (d.laizi ? '(赖)' : '×' + d.raw); }).join('、');
      r.push('有效进张：' + s + (b.detail.length > 8 ? ' 等 ' + b.detail.length + ' 种' : '') +
        '，牌墙里大约还有 <b>' + b.outs.toFixed(1) + '</b> 张（未见共 ' + b.outsRaw + ' 张）。');
    }

    // 3. 牌池依据（进张里已现多少）
    if (b.detail.length >= 2) {
      var parts = [];
      for (i = 0; i < Math.min(3, b.detail.length); i++) {
        var d = b.detail[i];
        if (d.laizi) continue;
        var seen = 4 - d.raw;
        parts.push(tn(d.tile) + ' 已现 ' + seen + ' 张、还剩 <b>' + d.raw + '</b> 张');
      }
      if (parts.length) r.push('看牌池：' + parts.join('；') + '。剩得越多，越值得把它当主力进张。');
    }

    // 4. 他家不要的牌
    var sig = [];
    for (i = 1; i < 4; i++) {
      var p = G.players[i], sd = [0, 0, 0];
      for (var j = 0; j < p.discards.length; j++) if (p.discards[j] !== lt) sd[MJ.suitOf(p.discards[j])]++;
      var mx = 0, arg = 0;
      for (var k = 0; k < 3; k++) if (sd[k] > mx) { mx = sd[k]; arg = k; }
      if (mx >= 3) sig.push({ n: p.name, s: arg, c: mx });
    }
    if (sig.length) {
      var txt = sig.map(function (x) { return x.n + '已打 ' + x.c + ' 张' + MJ.SUITS[x.s]; }).join('，');
      r.push('读牌：' + txt + ' —— 说明这门他们不要，<b>该门的牌更多留在牌墙里</b>，你的这门进张更可靠。');
    }
    var meldSig = [];
    for (i = 1; i < 4; i++) {
      for (var m = 0; m < G.players[i].melds.length; m++) {
        var md = G.players[i].melds[m];
        meldSig.push(G.players[i].name + '碰了 ' + tn(md.tile));
      }
    }
    if (meldSig.length) r.push('已被消耗：' + meldSig.join('，') + ' —— 同门牌少了 3 张，别再指望靠它进张。');

    // 5. 赖子
    if (L > 0) {
      r.push('你手上有 <b>' + L + '</b> 张赖子（' + tn(lt) + '）：赖子能补任何搭子，' +
        (b.laiziLeft >= L ? '打这一张不会浪费赖子' : '打掉它会少一张万能牌，要慎重') + '。' +
        (L >= 2 ? '两张赖子可以直接当一对将用。' : ''));
    }

    // 5b. 赖子个数限制（关键规则）
    var Lc = H.laizi || MJ.laiziStatus(me.hand, me.melds, lt);
    if (MJ.rules.laiziLimit !== 'none' && Lc.over) {
      r.push('<b style="color:#a53434">⚠️ 你手上有 ' + Lc.laizi + ' 张赖子，超过 ' + MJ.rules.maxLaizi +
        ' 张 —— 这样<b>永远胡不了</b>（本玩法没有大胡，赖子限制没有例外）。</b>' +
        '必须尽快把多余的赖子打掉。');
    }
    if (H.winTiles && H.winTiles.length === 0 && (b.shanten <= 0)) {
      r.push('<b style="color:#a53434">注意：你现在是「假听」</b> —— 牌型上听牌了，但因为赖子超数，实际一张都胡不了，先处理赖子。');
    }

    // 6. 硬胡 / 赖子用法
    if (b.fan.ying >= 1) {
      r.push('打完这一张你手上<b>没有赖子</b>，胡了算<b>硬胡</b>（基数 2 分，软胡只有 1 分；对家撑过赖子还会翻倍）。');
    }

    // 7. 对比次优
    if (H.list.length > 1) {
      var sc = H.list[1];
      var d = b.outs - sc.outs;
      if (sc.shanten === b.shanten && Math.abs(d) > 0.4) {
        r.push('对比：第二选择是打 <b>' + tn(sc.discard) + '</b>（进张约 ' + sc.outs.toFixed(1) + ' 张）。' +
          '打 <b>' + tn(b.discard) + '</b> 多 <b>' + d.toFixed(1) + '</b> 张进张，' +
          '按剩余牌数估算，胡牌机会约高 <b>' + Math.min(60, Math.round(d / Math.max(1, G.wall.length) * 100 * 2.2)) + '%</b>。');
      } else if (sc.shanten !== b.shanten) {
        r.push('对比：打 <b>' + tn(sc.discard) + '</b> 会掉到 ' + sc.shanten + ' 向听（慢一步），所以不推荐。');
      }
    }

    // 8. 风险
    if (b.risk > 0.25) {
      r.push('<span class="dim">补充：' + tn(b.discard) + ' 还有 ' + ctx.unseen[b.discard] + ' 张没露面，被人碰走的概率约 ' +
        Math.round(b.risk * 100) + '%。本规则只能自摸，出牌不会被点炮，所以主要还是看进张。</span>');
    } else {
      r.push('<span class="dim">补充：本规则只能自摸，出牌没有点炮风险 —— 所以这里唯一目标就是让<b>自己的有效进张最大</b>。</span>');
    }
    return r;
  }

  function reviewHTML(R) {
    var ok = R.same, tie = !!R.eq, good = (ok || tie);
    var tone = good ? '#8a5f14' : '#a53434';
    var h = '<div class="rec-head" style="' + (good ? '' : 'background:linear-gradient(180deg,#fff6f6,#fdeaea);border-color:#eec0c0') + '">' +
      '<div><div style="font-size:12px;color:' + tone + '">上一手你打了</div>' +
      '<div class="big" style="color:' + tone + '">' + tn(R.played) + '</div></div>' +
      '<div style="flex:1;font-size:12.5px;line-height:1.6">' +
      (ok ? '<b style="color:#186b43">✓ 和教练一致</b>' :
        tie ? '<b style="color:#186b43">✓ 并列最优（评分一样）</b>' :
          '<b style="color:#a53434">✗ 教练建议打 ' + tn(R.best) + '</b>') +
      '<br><span style="color:#5b6570">' + R.text + '</span></div></div>';
    return h;
  }

  function candTableHTML(H, picked) {
    var lt = G.laiziType, bs = {};
    if (H.bestSet) for (var z = 0; z < H.bestSet.length; z++) bs[H.bestSet[z]] = 1;
    var h = '<div class="sub-h">出哪张更好（按评分排序）' + ((H.bestSet && H.bestSet.length > 1) ? '　<span class="badge g">并列最优 ' + H.bestSet.length + ' 张</span>' : '') + '</div><table class="cand"><tr><th>打</th><th>向听</th><th>进张(牌墙)</th><th>进张(未见)</th><th>剩赖子</th><th>评分</th></tr>';
    for (var i = 0; i < H.list.length; i++) {
      var c = H.list[i];
      var lzBad = c.laiziOver ? ' style="color:#a53434"' : '';
      var isTop = !!bs[c.discard];
      h += '<tr class="' + (isTop ? 'top' : '') + (c.discard === picked ? ' mine' : '') + '"><td style="white-space:nowrap"><span style="display:inline-block;vertical-align:middle">' + tileHTML(c.discard, 'sm', lt) + '</span>' +
        (c.discard === picked ? ' <span style="font-size:10px;color:#17415f">你选的</span>' : '') +
        (isTop ? ' <span style="font-size:10px;color:#8a5f14">★推荐</span>' : '') + '</td>' +
        '<td>' + (c.shanten <= 0 ? '听牌' : c.shanten) + '</td>' +
        '<td>' + c.outs.toFixed(1) + '</td><td>' + c.outsRaw + '</td>' +
        '<td' + lzBad + '>' + c.laiziLeft + (c.laiziOver ? ' 超限' : '') + '</td>' +
        '<td>' + Math.round(c.score) + '</td></tr>';
    }
    h += '</table><div style="font-size:11.5px;color:#8a939d;margin-top:6px">「进张(牌墙)」已扣掉推测在他家手里的牌，更接近真实能摸到的张数；评分相同的几张都算推荐。</div>';
    return h;
  }

  function remainGridHTML() {
    var H = G.hint, lt = G.laiziType;
    var hot = {};
    // 还没揭晓时不要标出你的有效进张，否则等于泄题
    if (H && H.best && showAnswer()) for (var i = 0; i < H.best.detail.length; i++) hot[H.best.detail[i].tile] = 1;
    var ctx = H ? H.ctx : buildCtx(0);
    /* 真麻将 + 蒙层：赖子金蒙层(自带「赖」角标)；普通牌灰蒙层，剩得越少蒙层越厚；
     * 右下角数字=未见张数；绿框=你的有效进张 */
    function tile(t, u) {
      var isLz = (t === lt), veil = '';
      if (isLz) veil = '<div style="position:absolute;inset:0;background:rgba(232,181,58,.34);border-radius:5px;pointer-events:none"></div>';
      else if (u < 4) { var a = ((4 - u) / 4 * 0.62).toFixed(2); veil = '<div style="position:absolute;inset:0;background:rgba(88,97,105,' + a + ');border-radius:5px;pointer-events:none"></div>'; }
      var num = '<div style="position:absolute;right:-1px;bottom:-1px;background:rgba(33,39,43,.85);color:#fff;font-size:9px;line-height:1;padding:1px 3px;border-radius:5px 0 5px 0;font-weight:700;pointer-events:none">' + u + '</div>';
      var frame = hot[t] ? 'outline:2px solid #1e7a4e;outline-offset:-1px;' : '';
      return '<div title="' + tileTitle(t, lt) + ' · 剩 ' + u + ' 张" style="position:relative;flex:none;border-radius:5px;' + frame + '">' +
        tileHTML(t, 'sm', lt) + veil + num + '</div>';
    }
    var h = '<div class="sub-h" style="margin-top:14px">牌池剩余（牌面下数字 = 未见张数；蒙层越厚剩得越少）</div>';
    for (var s = 0; s < 3; s++) {
      h += '<div class="suitrow"><span class="lb">' + MJ.SUITS[s] + '</span><div style="flex:1;display:flex;flex-wrap:wrap;gap:3px">';
      for (var n = 1; n <= 9; n++) {
        var t = MJ.T(s, n), u;
        if (t === lt) u = ctx.unseenLaizi; else u = ctx.unseen[t];
        h += tile(t, u);
      }
      h += '</div></div>';
    }
    h += '<div style="font-size:11.5px;color:#8a939d;margin-top:6px">' +
      '<span class="badge g">绿框</span> = 你的有效进张　<span class="badge y">金蒙层+赖</span> = 赖子　蒙层越灰 = 剩得越少（0=绝张）</div>';
    return h;
  }

  /* ---------------- 出牌提示计算 ---------------- */
  function computeHint() {
    var me = G.players[0];
    var ctx = buildCtx(0);
    ctx.noDiscardLaizi = !S.laiziDiscard;
    var list = MJ.evaluateDiscards(me.hand, G.laiziType, me.melds.length, ctx);
    if (!list.length) { ctx.noDiscardLaizi = false; list = MJ.evaluateDiscards(me.hand, G.laiziType, me.melds.length, ctx); }
    if (!list.length) return null;
    G.hint = { list: list, best: list[0], ctx: ctx, hand: me.hand.slice() };
    // 并列最优：评分（四舍五入后）与第一名相同的牌，全部算教练推荐
    G.hint.bestSet = [];
    for (var bi = 0; bi < list.length; bi++)
      if (Math.round(list[bi].score) === Math.round(list[0].score)) G.hint.bestSet.push(list[bi].discard);
    // 赖子超数时，实际能胡的牌可能一张都没有（假听）
    var lz = MJ.laiziStatus(me.hand, me.melds, G.laiziType);
    G.hint.laizi = lz;
    G.hint.laiziAfter = {};
    for (var i = 0; i < list.length; i++) G.hint.laiziAfter[list[i].discard] = list[i];
    if (MJ.shanten(me.hand, G.laiziType, me.melds.length) <= 0) {
      G.hint.winTiles = MJ.winningTiles(me.hand, me.melds, G.laiziType, ctx.opts);
    }
    G.revealed = (S.coachMode === 'show');   // 每手牌重新决定要不要直接给答案
    G.pick = null; G.pickSlot = null;
    return G.hint;
  }
  function showAnswer() { return !!(G.hint && (G.revealed || G.phase === 'confirm')); }

  /* ---------------- 流程 ---------------- */
  function startDraw(seat, fromKong) {
    if (G.over) return;
    G.turn = seat;
    G.phase = 'draw';
    G.canWin = false;
    G.winDismissed = false;   // 新摸一手，重置「本手已点过」标记
    G.pending = null;
    var p = G.players[seat];
    if (G.wall.length === 0) { doDrawGame_(); return; }
    var t = G.wall.pop();
    p.hand.push(t); p.drawn = t;
    SFX.draw();
    if (seat === 0) SFX.say('摸' + zhName(t));   // 自己摸的牌读作「摸X万」，练听牌感
    G.status = p.name + ' 摸牌…';
    G.phase = 'discard';

    var w = MJ.checkWin(p.hand, p.melds, G.laiziType, winOpts(seat));
    var isWin = w.win;

    // AI：先看有没有值得开的杠（杠本身收钱，还能补一张）
    if (seat !== 0 && S.kong && !isWin) {
      var opts = kongOptions(p);
      if (opts.length) {
        var bestKong = null;
        for (var oi = 0; oi < opts.length; oi++) {
          if (aiWantKong(p, opts[oi])) { bestKong = opts[oi]; break; }
        }
        if (bestKong) {
          G.winInfo = w;
          setTimeout(function () { aiDoKong(seat, bestKong); }, S.delay);
          render();
          return;
        }
      }
    }

    if (seat === 0) {
      G.canWin = isWin;
      if (isWin) { G.pending = { type: 'win' }; G.claimSel = null; }   // 能胡：弹框 胡/过（与碰/杠同款）
      G.canKongList = (S.kong ? kongOptions(p) : []);
      G.decisionNote = null;
      computeHint();
      render();
    } else {
      render();
      if (isWin) { setTimeout(function () { aiWin(seat, !!fromKong); }, S.delay); return; }
      setTimeout(function () { aiDiscard(seat); }, S.delay);
    }
  }

  function humanDiscard(t, si) {
    var inConfirm = (G.phase === 'confirm');
    if (!(G.turn === 0 && (G.phase === 'discard' || inConfirm)) || G.over) return;
    var me = G.players[0];
    if (me.hand.indexOf(t) < 0) return;
    if (t === G.laiziType && !S.laiziDiscard) { toast('当前规则：赖子不能打出（可在设置里改）'); return; }

    // 确认阶段再点别的牌 = 直接改选（不再需要「再想想」）；
    // 再点一次同一张牌 = 直接打出（同型牌点的是哪一张也算数）
    if (inConfirm) {
      if (t === G.pick && (si == null || si === G.pickSlot)) { UI.quickPlay(t); return; }
      G.pick = t; G.pickSlot = (si == null ? null : si); render(); return;
    }
    G.pickSlot = (si == null ? null : si);

    // 记录「第一直觉」命中率 —— 这才是真实水平（并列最优的几张都算命中）
    if (G.hint) {
      var hit = inBestOf(G.hint, t);
      var st0 = loadStat();
      st0.first = (st0.first || 0) + 1;
      if (hit) st0.firstHit = (st0.firstHit || 0) + 1;
      saveStat(st0);
      G.rs.first++;
      if (hit) G.rs.firstHit++;
    }

    // 「先练后看」模式：先让你自己选，选完再揭晓推荐并讲解
    if (S.coach !== 'off' && S.coachMode === 'think' && G.hint && !G.revealed) {
      G.pick = t; G.phase = 'confirm';
      render();
      return;
    }
    commitDiscard(t, null);
  }

  /** 真正打出去：先选后看模式下 pick 是玩家原先的选择 */
  function commitDiscard(t, pick) {
    var me = G.players[0];
    // 能胡弹框还开着就点牌出牌 = 视为选了「过」
    if (G.pending && G.pending.type === 'win') { G.pending = null; G.winDismissed = true; G.claimSel = null; }
    G.winDismissed = false;                       // 出牌后进入下一流程，重置「本手已点过」
    var declinedWin = !!G.canWin;                 // 本可胡却选择继续打牌
    var hadKong = !!(G.canKongList && G.canKongList.length);  // 本有可开的杠却没开
    G.phase = 'discard';
    if (G.hint) {
      var best = G.hint.best, mine = null;
      for (var i = 0; i < G.hint.list.length; i++) if (G.hint.list[i].discard === t) mine = G.hint.list[i];
      var st = loadStat(); st.discards++;
      var same = (t === best.discard);
      var eq = (!same && inBestOf(G.hint, t));   // 不是同一张，但同属并列最优
      if (same || eq) st.agree++;
      if (mine) { st.shantenSum += mine.shanten; st.shantenN++; G.rs.shSum += mine.shanten; G.rs.shN++; }
      saveStat(st);
      var text = '';
      if (same && pick == null) text = '你的选择和引擎一致，继续保持。';
      else if (same && pick != null) text = '教练揭晓后你把手上的牌换成了推荐打法 —— 记住这个差别，下次要自己先想到。';
      else if (eq && mine) text = '选择和教练不同，但几张牌评分完全一样（同为最优）—— 打哪张都不亏。';
      else if (mine) {
        var ds = mine.shanten - best.shanten;
        if (ds > 0) text = '这一手会慢 ' + ds + ' 步（向听从 ' + best.shanten + ' 变成 ' + mine.shanten + '）。';
        else {
          var dd = best.outs - mine.outs;
          text = '向听一样，但进张少 ' + dd.toFixed(1) + ' 张（' + mine.outs.toFixed(1) + ' vs ' + best.outs.toFixed(1) + '）。';
        }
      }
      G.review = { played: t, best: best.discard, same: same, eq: eq, changed: (pick != null && pick !== t), text: text };
    }
    // 胡/不胡、杠/不杠：选后才揭晓教练对比（先选后看）
    if (declinedWin) {
      G.decisionNote = '你这手<b>可以胡</b>却选择继续打牌。教练建议：能胡尽量胡 —— 软胡（赖子当任意牌，基数 1）硬胡（没用赖子，基数 2）都有分，除非你明确在冲更大的牌型。';
    } else if (hadKong) {
      var _ko = G.canKongList[0], _kOK = aiWantKong(me, _ko);
      G.decisionNote = '你这手有可开的<b>杠</b>（' + tn(_ko.tile) + '）却没开。教练建议：' +
        (_kOK ? '这手杠不亏（向听不会变慢、还能白收一笔钱、杠后补一张），该开；' : '这手杠会让牌型变慢，不杠更稳；') +
        ' 杠是独立收钱的，一般值得开。';
    }
    G.canWin = false;
    G.pick = null; G.pickSlot = null;
    doDiscard(0, t);
  }

  function doDiscard(seat, t) {
    var p = G.players[seat];
    var i = p.hand.indexOf(t);
    if (i < 0) return;
    p.hand.splice(i, 1);
    p.discards.push(t);
    p.drawn = null;
    G.history.push({ tile: t, seat: seat });
    G.lastDiscard = { tile: t, seat: seat, idx: p.discards.length - 1 };
    if (t === G.laiziType) { SFX.laizi(); SFX.say('赖子'); }
    else { SFX.discard(); SFX.say(zhName(t)); }
    G.hint = null;
    G.phase = 'wait';   // 出牌后进入等待，防止连点

    // 更新听牌标记
    for (var k = 0; k < 4; k++) {
      var q = G.players[k];
      q.ting = MJ.shanten(q.hand, G.laiziType, q.melds.length) <= 0;
      if (q.ting) {   // 赖子超数且做不成大胡 = 假听
        var ls = MJ.laiziStatus(q.hand, q.melds, G.laiziType);
        if (ls.over && !ls.bigPossible) q.ting = false;
      }
    }
    render();

    // 询问其他家碰/杠
    var claims = [];
    for (var s = 1; s <= 3; s++) {
      var seat2 = (seat + s) % 4, p2 = G.players[seat2];
      if (t === G.laiziType) continue;   // 赖子不能被碰杠
      var cnt = 0;
      for (var j = 0; j < p2.hand.length; j++) if (p2.hand[j] === t) cnt++;
      if (cnt >= 3 && S.kong) claims.push({ seat: seat2, kind: 'kong', priority: 2 });
      else if (cnt >= 2) claims.push({ seat: seat2, kind: 'pung', priority: 1 });
    }
    if (claims.length) {
      claims.sort(function (a, b) { return b.priority - a.priority || ((a.seat - seat + 4) % 4) - ((b.seat - seat + 4) % 4); });
      var taken = null;
      for (var ci = 0; ci < claims.length; ci++) {
        var c = claims[ci];
        if (c.seat === 0) { taken = c; break; }      // 轮到人，交给玩家决定
        var ctx = buildCtx(c.seat);
        var doIt = (c.kind === 'kong')
          ? MJ.aiShouldKong(G.players[c.seat].hand, G.laiziType, G.players[c.seat].melds.length, t, ctx)
          : MJ.aiShouldPung(G.players[c.seat].hand, G.laiziType, G.players[c.seat].melds.length, t, ctx, S.level);
        if (doIt) { taken = c; break; }
      }
      if (taken && taken.seat === 0) {
        G.pending = {
          type: 'claim', tile: t, from: seat, kind: taken.kind,
          who: G.players[seat].name,
          canPung: true, canKong: (taken.kind === 'kong')
        };
        G.claimSel = null;   // 进新的碰牌决策：选择清空
        G.phase = 'claim';
        render();
        return;
      }
      if (taken) {
        (function (cc) { setTimeout(function () { applyClaim(cc.seat, t, cc.kind, seat); }, S.delay); })(taken);
        return;
      }
    }
    setTimeout(function () { startDraw((seat + 1) % 4, false); }, gap());
  }

  function applyClaim(seat, tile, kind, from) {
    var p = G.players[seat];
    var removed = 0;
    for (var i = p.hand.length - 1; i >= 0 && removed < (kind === 'kong' ? 3 : 2); i--) {
      if (p.hand[i] === tile) { p.hand.splice(i, 1); removed++; }
    }
    // 被碰/杠走的那张牌从出牌者面前的弃牌区拿走，摆到碰/杠者面前（副露里）
    var fromP = G.players[from];
    if (fromP && fromP.discards.length && fromP.discards[fromP.discards.length - 1] === tile) {
      fromP.discards.pop();
    }
    G.lastDiscard = null;
    p.melds.push({ type: kind === 'kong' ? 'kong' : 'pung', tile: tile, from: from });
    p.drawn = null;
    G.pending = null;
    if (kind === 'kong') kongPay(seat, 'kong', tile, from);
    else { SFX.pung(); SFX.say('碰，' + zhName(tile)); toast(p.name + ' 碰 ' + tn(tile)); }
    render();
    if (kind === 'kong') {
      // 杠后从牌尾补一张
      if (G.wall.length === 0) { doDrawGame_(); return; }
      var t = G.wall.pop(); p.hand.push(t); p.drawn = t;
      var kw = MJ.checkWin(p.hand, p.melds, G.laiziType, winOpts(seat));
      if (kw.win) {
        if (seat === 0) { G.turn = 0; G.phase = 'discard'; G.canWin = true; G.winInfo = kw; G.pending = { type: 'win' }; G.claimSel = null; computeHint(); render(); return; }
        setTimeout(function () { aiWin(seat, true); }, S.delay); return;
      }
    }
    G.turn = seat; G.phase = 'discard';
    if (seat === 0) {
      var cw = MJ.checkWin(p.hand, p.melds, G.laiziType, winOpts(seat));
      G.canWin = cw.win; G.winInfo = cw;
      G.canKongList = kongOptions(p);   // 杠后刷新可杠列表，避免自动托管重复杠
      computeHint();
      render();
    } else setTimeout(function () { aiDiscard(seat); }, S.delay);
  }

  /** 杠的三种：暗杠(自己摸4张) / 补杠(碰过又摸到第4张) / 明杠(别人打出的) */
  function kongOptions(me) {
    if (!S.kong) return [];
    var cnt = {}, out = [], i;
    for (i = 0; i < me.hand.length; i++) cnt[me.hand[i]] = (cnt[me.hand[i]] || 0) + 1;
    for (var k in cnt) {
      var t = +k;
      if (cnt[t] === 4) out.push({ tile: t, kind: 'angang' });
    }
    for (i = 0; i < me.melds.length; i++) {
      var m = me.melds[i];
      if (m.type === 'pung' && cnt[m.tile] >= 1) out.push({ tile: m.tile, kind: 'jiagang' });
    }
    return out;
  }
  function myKongOptions(me) { return kongOptions(me); }

  /* ---------------- AI ---------------- */
  /** 杠值不值得开：杠完补一张还能保住向听就开 */
  function aiWantKong(p, opt) {
    var lt = G.laiziType, i;
    // 基准：不杠、直接打一张之后的状态
    var base = p.hand.slice();
    if (p.drawn != null) { var di = base.indexOf(p.drawn); if (di >= 0) base.splice(di, 1); }
    var before = MJ.shanten(base, lt, p.melds.length);
    // 杠掉之后（补杠面子数不变，暗杠 +1）
    var rest = p.hand.slice(), removed = 0;
    var need = (opt.kind === 'angang') ? 4 : 1;
    for (i = rest.length - 1; i >= 0 && removed < need; i--) {
      if (rest[i] === opt.tile) { rest.splice(i, 1); removed++; }
    }
    var meldsAfter = p.melds.length + (opt.kind === 'jiagang' ? 0 : 1);
    var after = MJ.shanten(rest, lt, meldsAfter);
    return after <= before;
  }

  function aiDoKong(seat, opt) {
    var p = G.players[seat], i;
    if (opt.kind === 'angang') {
      var removed = 0;
      for (i = p.hand.length - 1; i >= 0 && removed < 4; i--) if (p.hand[i] === opt.tile) { p.hand.splice(i, 1); removed++; }
      p.melds.push({ type: 'kong', tile: opt.tile, from: seat });
    } else {
      var ri = p.hand.indexOf(opt.tile);
      if (ri >= 0) p.hand.splice(ri, 1);
      for (i = 0; i < p.melds.length; i++) if (p.melds[i].type === 'pung' && p.melds[i].tile === opt.tile) { p.melds[i].type = 'kong'; break; }
    }
    kongPay(seat, opt.kind, opt.tile, seat);
    render();
    if (G.wall.length === 0) { doDrawGame_(); return; }
    setTimeout(function () { startDraw(seat, true); }, S.delay);
  }

  function aiDiscard(seat) {
    if (G.over) return;
    var p = G.players[seat];
    var ctx = buildCtx(seat);
    ctx.noDiscardLaizi = !S.laiziDiscard;
    var t = MJ.aiChooseDiscard(p.hand, G.laiziType, p.melds.length, ctx, S.level);
    if (t == null) t = p.hand[p.hand.length - 1];
    doDiscard(seat, t);
  }

  function aiWin(seat, fromKong) { endGame(seat, fromKong); }

  /* ---------------- 结束 ---------------- */
  function endGame(seat, fromKong) {
    G.over = true; G.phase = 'over';
    SFX.win();
    SFX.say(seat === 0 ? '胡了' : G.players[seat].name + '胡了');
    var p = G.players[seat];
    var last = (G.wall.length === 0);
    var win = MJ.checkWin(p.hand, p.melds, G.laiziType, winOpts(seat));
    // 撑赖子（只影响胡的费用，不影响杠）：付家应付 = 基数 × 2^n，
    // n = 胡牌那家撑的次数 + 付钱那家撑的次数
    function countCheng(s) { var c = 0; for (var ci = 0; ci < G.players[s].discards.length; ci++) if (G.players[s].discards[ci] === G.laiziType) c++; return c; }
    var winnerCheng = countCheng(seat);
    var an = MJ.analyzeWin(p.hand, p.melds, G.laiziType, { lastTile: last, minWin2: S.minWin2 });
    var gain = 0, pays = [];
    for (var i = 0; i < 4; i++) if (i !== seat) {
      var payerCheng = countCheng(i);
      var exp = winnerCheng + payerCheng;
      var pay = MJ.chengPay(an.per, winnerCheng, payerCheng);
      G.players[i].score -= pay;
      gain += pay;
      pays.push({ seat: i, cheng: payerCheng, exp: exp, pay: pay });
    }
    an.cheng = winnerCheng;
    an.pays = pays;
    p.score += gain;

    var st = loadStat(); st.games++;
    if (seat === 0) {
      st.wins++; st.fanSum += an.fan; if (an.fan > st.bestFan) st.bestFan = an.fan;
    }
    var myScore = G.players[0].score;   // 本局你的净分（可能为负）
    saveStat(st);
    recordGame({
      t: Date.now(),
      result: (seat === 0 ? 'win' : 'lose'),
      fan: (seat === 0 ? an.fan : 0),
      score: myScore,
      first: G.rs.first, firstHit: G.rs.firstHit,
      avgSh: G.rs.shN ? +(G.rs.shSum / G.rs.shN).toFixed(2) : null
    });
    G.result = { seat: seat, an: an, win: win, hand: p.hand.slice(), melds: p.melds.slice() };
    render();
    showResult(seat, an, gain, win);
  }

  function doDrawGame_() {
    G.over = true; G.phase = 'over';
    var st = loadStat(); st.games++; st.draws++; saveStat(st);
    recordGame({
      t: Date.now(), result: 'draw', fan: 0, score: G.players[0].score,
      first: G.rs.first, firstHit: G.rs.firstHit,
      avgSh: G.rs.shN ? +(G.rs.shSum / G.rs.shN).toFixed(2) : null
    });
    G.result = null;
    render();
    UI.openModal('荒庄（流局）', '<p>牌墙摸完了，本局无人自摸。</p>' +
      '<div class="hint">晃晃是<b>只能自摸</b>的玩法：荒庄很常见，说明大家都在抢时间。下次可以更早定方向，别在中途反复改牌型。</div>' +
      '<div class="kv"><div class="k">你的手牌</div><div>' + G.players[0].hand.slice().sort(cmpTile).map(function (t) { return tn(t); }).join(' ') + '</div>' +
      '<div class="k">向听</div><div>' + MJ.shanten(G.players[0].hand, G.laiziType, G.players[0].melds.length) + '</div></div>',
      [{ t: '再来一局', cls: 'primary', f: 'UI.newGame()' }]);
  }

  /** 胡牌 / 荒庄后四家全部亮牌 */
  function revealAllHTML(winnerSeat) {
    var h = '<div class="sub-h" style="margin-top:14px">四家亮牌</div>';
    for (var i = 0; i < 4; i++) {
      var p = G.players[i];
      var sh = MJ.shanten(p.hand, G.laiziType, p.melds.length);
      var tag = (i === winnerSeat) ? '<span class="badge y">胡牌</span>'
        : (sh === -1 ? '<span class="badge y">可胡</span>'
          : sh === 0 ? '<span class="badge r">听牌</span>' : '<span class="badge">' + sh + ' 向听</span>');
      h += '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0 2px">' +
        '<span style="font-size:12.5px;font-weight:600">' + p.name + '</span>' + tag +
        '<span style="font-size:11.5px;color:#8a939d">' + (p.score > 0 ? '+' : '') + p.score + ' 分</span></div>';
      h += '<div class="result-tiles" style="margin:2px 0">' +
        p.hand.slice().sort(cmpTile).map(function (t) { return tileHTML(t, 'sm', G.laiziType); }).join('') +
        (p.melds.length ? '<span style="width:10px;display:inline-block"></span>' + p.melds.map(function (m) {
          var s2 = ''; for (var c = 0; c < (m.type === 'kong' ? 4 : 3); c++) s2 += tileHTML(m.tile, 'sm', G.laiziType);
          return s2;
        }).join('<span style="width:4px;display:inline-block"></span>') : '') +
        '</div>';
    }
    return h;
  }

  function showResult(seat, an, gain, win) {
    win = win || { laizi: 0, big: false, types: [] };
    var p = G.players[seat];
    var h = '';
    h += '<div style="font-size:15px;margin-bottom:6px"><b>' + p.name + '</b> 自摸！' + (seat === 0 ? '🎉 恭喜' : '（下次加油）') + '</div>';
    h += '<div class="wintype">' + an.items.map(function (x) { return '<span class="badge y">' + x.n + (typeof x.v === 'number' ? ' +' + x.v : '') + '</span>'; }).join('') +
      '<span class="badge r">基数 ' + an.fan + ' 分</span></div>';
    if (win.laizi > 0) {
      h += '<div class="hint" style="margin-top:8px">手上用了 <b>' + win.laizi + '</b> 张赖子 —— ' +
        (an.ying ? '都当<b>本身牌面</b>用，仍算<b>硬胡</b>（基数 2 分）。'
                 : '当<b>任意牌</b>凑的牌型，算<b>软胡</b>（基数 1 分）。') + '</div>';
    }
    if (an.cheng > 0) {
      h += '<div class="hint" style="margin-top:6px">本局你撑（打出）过 <b>' + an.cheng + '</b> 张赖子 —— 胡的费用按 <b>2^n</b> 翻倍：' +
        'n = <b>你撑的张数 + 付钱那家撑的张数</b>。（撑赖子只影响胡的费用，不影响杠收的钱）</div>';
    }
    h += revealAllHTML(seat);
    if (G.kongLog.length) {
      h += '<div class="sub-h" style="margin-top:12px">本局杠（独立收钱）</div><div class="kv">';
      for (var ki = 0; ki < G.kongLog.length; ki++) {
        var kl = G.kongLog[ki];
        h += '<div class="k">' + G.players[kl.seat].name + ' · ' + MJ.kongName(kl.kind) + ' ' + tn(kl.tile) + '</div>' +
          '<div>' + (kl.per > 0
            ? (kl.kind === 'kong'
                ? G.players[kl.from !== undefined ? kl.from : kl.seat].name + ' 付 ' + kl.per
                : '每家 ' + kl.per + '，共 +' + kl.per * 3)
            : '不收钱') + '</div>';
      }
      h += '</div>';
    }
    h += '<div class="kv" style="margin-top:10px"><div class="k">本局胡牌得分</div><div>' + gain + ' 分</div>';
    var pays = an.pays || [];
    for (var pi = 0; pi < pays.length; pi++) {
      var pd = pays[pi];
      var why2 = [];
      if (an.cheng > 0) why2.push('胡家撑 ' + an.cheng);
      if (pd.cheng > 0) why2.push('他撑 ' + pd.cheng);
      h += '<div class="k">' + G.players[pd.seat].name + ' 付' +
        (pd.exp > 0 ? '（' + why2.join(' + ') + ' → ×' + Math.pow(2, pd.exp) + '）' : '') + '</div><div>' + pd.pay + ' 分</div>';
    }
    h += '<div class="k">' + G.players[seat].name + '</div><div>+' + gain + ' 分</div>';
    h += '</div>' +
      '<div class="sub-h" style="margin-top:12px">你的分数</div><div class="kv">' +
      '<div class="k">本局</div><div>' + myScoreHTML(G.players[0].score) + '</div>' +
      '<div class="k">累计总分</div><div>' + myScoreHTML(loadStat().totalScore || 0) +
      '　<span style="font-size:11.5px;color:#8a939d">可在「我的统计」里重置</span></div></div>';
    if (seat !== 0) {
      h += '<div class="hint">复盘：本局你' + (G.players[0].ting ? '也听了牌' : '还没听牌（' + MJ.shanten(G.players[0].hand, G.laiziType, G.players[0].melds.length) + ' 向听）') +
        '。晃晃只能自摸，谁先把手牌整理成「4 面子 + 1 将」并抢先摸到有效牌，谁就赢。</div>';
    }
    UI.openModal('本局结算', h, [{ t: '再来一局', cls: 'primary', f: 'UI.newGame()' }, { t: '看统计', f: 'UI.showStat()' }]);
  }

  /* ---------------- 对外接口 ---------------- */
  var UI = window.UI = {
    newGame: function () { UI.closeModal(); newGame(); },
    /** 碰/杠/过 & 胡/过：第一次点是「选择」（同一个按钮再点一次才真正执行） */
    claimPick: function (kind) {
      if (!G.pending) return;
      if (G.pending.type === 'win') {          // 胡/过 与碰/杠同款两段式确认
        if (G.claimSel === kind) {
          G.claimSel = null;
          if (kind === 'win') UI.selfWin(); else UI.dismissWin();
          return;
        }
        G.claimSel = kind; render(); return;
      }
      if (G.pending.type !== 'claim') return;
      if (G.claimSel === kind) { UI.claim(kind); return; }
      G.claimSel = kind;
      render();
    },
    claim: function (kind) {
      if (!G.pending) return;
      var pd = G.pending;
      var myKind = (kind === 'pass') ? 'pass' : (kind === 'kong' ? 'kong' : 'pung');
      // 记录「我的选择 vs 教练推荐」，并累计命中率
      var A = (S.coach !== 'off') ? claimAdvice() : null;
      if (A) {
        var st = loadStat();
        st.claimN = (st.claimN || 0) + 1;
        if (myKind === A.advice) st.claimHit = (st.claimHit || 0) + 1;
        saveStat(st);
        var nm = function (k) { return k === 'pass' ? '过' : (k === 'kong' ? '杠' : '碰'); };
        var mineP = (myKind === 'pass') ? A.pA : A.pB;
        var advP = (A.advice === 'pass') ? A.pA : A.pB;
        if (myKind === A.advice) {
          toast('✓ 和教练一致（' + nm(myKind) + '，赢面约 ' + Math.round(mineP * 100) + '%）');
        } else {
          toast('教练建议「' + nm(A.advice) + '」：赢面 ' + Math.round(advP * 100) + '% vs 你选的' +
            nm(myKind) + ' ' + Math.round(mineP * 100) + '%');
        }
      }
      G.claimSel = null;
      if (kind === 'pass') {
        G.pending = null; G.hint = null;
        render();
        setTimeout(function () { startDraw((pd.from + 1) % 4, false); }, 200);
        return;
      }
      G.pending = null;
      applyClaim(0, pd.tile, kind === 'kong' ? 'kong' : 'pung', pd.from);
    },
    /** 胡牌：先选后看 —— 点了才判断。能胡就胡；不能胡给出反馈（还差几步） */
    selfWin: function () {
      if (G.over || G.turn !== 0) return;
      var me = G.players[0];
      var cw = MJ.checkWin(me.hand, me.melds, G.laiziType, winOpts(0));
      if (!cw.win) {
        toast('还不能胡：现在 ' + MJ.shanten(me.hand, G.laiziType, me.melds.length) + ' 向听（胡牌要 4 面子 + 1 将）');
        return;
      }
      G.pending = null; G.claimSel = null;
      endGame(0, false);
    },
    /** 自摸能胡时点「过」：本手不再弹胡框，继续出牌 */
    dismissWin: function () { G.pending = null; G.winDismissed = true; G.claimSel = null; render(); },
    /** 右键手牌 / 点牌上方徽标：直接打出这张（跳过确认，不再需要「再想想」） */
    quickPlay: function (t) {
      if (G.over || G.turn !== 0) return;
      var me = G.players[0];
      if (!me || me.hand.indexOf(t) < 0) return;
      if (t === G.laiziType && !S.laiziDiscard) { toast('当前规则：赖子不能打出（可在设置里改）'); return; }
      if (G.phase === 'confirm') {
        var pick = G.pick;
        // 打出的是自己原先选的 → 记为坚持；否则记「教练揭晓后改打」
        commitDiscard(t, (pick != null && pick !== t) ? pick : null);
      } else if (G.phase === 'discard') {
        commitDiscard(t, null);
      }
    },
    /** 兼容旧接口：改选（现在直接点别的牌即可） */
    rePick: function (t, si) { if (G.phase === 'confirm') { G.pick = t; G.pickSlot = (si == null ? null : si); render(); } },
    /** 先选后看模式：useRecommend=true 改打推荐，false 坚持自己的选择 */
    pickConfirm: function (useRecommend) {
      if (G.phase !== 'confirm' || !G.hint) return;
      var pick = G.pick;
      var t = useRecommend ? G.hint.best.discard : pick;
      commitDiscard(t, pick);
    },
    cancelPick: function () {
      if (G.phase !== 'confirm') return;
      G.phase = 'discard'; G.pick = null; G.pickSlot = null; render();
    },
    /** 想不出来时点它揭晓（只揭晓本手） */
    reveal: function () {
      if (!G.hint) return;
      G.revealed = true; G.phase = 'discard'; G.pick = null; G.pickSlot = null;
      render();
    },
    doKong: function (tile, kind) {
      var me = G.players[0], i;
      // 先选后看：点了杠才揭晓这手值不值（不提前在按钮上给答案）
      if (S.coach !== 'off') {
        var kOK = aiWantKong(me, { tile: tile, kind: kind });
        toast(kOK ? '教练：这手杠不亏 ✓' : '教练：这手杠会拖慢牌型（向听可能 +1）', 2400);
      }
      if (kind === 'angang') {
        var removed = 0;
        for (i = me.hand.length - 1; i >= 0 && removed < 4; i--) if (me.hand[i] === tile) { me.hand.splice(i, 1); removed++; }
        me.melds.push({ type: 'kong', tile: tile, from: 0 });
      } else {
        var ri = me.hand.indexOf(tile);
        if (ri >= 0) me.hand.splice(ri, 1);
        for (i = 0; i < me.melds.length; i++) if (me.melds[i].type === 'pung' && me.melds[i].tile === tile) { me.melds[i].type = 'kong'; break; }
      }
      kongPay(0, kind, tile, 0);
      if (G.wall.length === 0) { doDrawGame_(); return; }
      var t = G.wall.pop(); me.hand.push(t); me.drawn = t;
      G.turn = 0; G.phase = 'discard';
      // 本玩法没有杠上开花：杠后补的牌胡了就是普通自摸
      var cw = MJ.checkWin(me.hand, me.melds, G.laiziType, winOpts(0));
      G.canWin = cw.win; G.winInfo = cw;
      if (cw.win) { G.pending = { type: 'win' }; G.claimSel = null; }   // 补牌能胡：弹框 胡/过
      // 杠后手牌/副露已变，必须重新计算可杠列表，否则 autoTick 会对着已杠掉的牌反复杠（把牌墙摸空）
      G.canKongList = kongOptions(me);
      computeHint();
      render();
      // 先选后看：杠后补的牌能胡也不主动提示（没有杠上开花，补牌自摸就是普通自摸）
    },
    closeModal: function () { $('mask').classList.remove('on'); },
    openModal: function (title, body, btns) {
      $('mdTitle').textContent = title;
      $('mdBody').innerHTML = body;
      var f = '';
      (btns || []).forEach(function (b) {
        f += '<button class="' + (b.cls || '') + '" onclick="' + b.f + '">' + b.t + '</button>';
      });
      if (!(btns || []).length) f = '<button onclick="UI.closeModal()">关闭</button>';
      $('mdFoot').innerHTML = f;

  /* ---------------- 成长曲线（纯 SVG，不依赖外部库） ---------------- */
  function movingAvg(vals, n) {
    var out = [], i;
    for (i = 0; i < vals.length; i++) {
      var s = 0, c = 0;
      for (var j = Math.max(0, i - n + 1); j <= i; j++) if (vals[j] != null) { s += vals[j]; c++; }
      out.push(c ? s / c : null);
    }
    return out;
  }

  /**
   * vals: 数字数组（null 表示这局没数据）
   * opts: {min,max,color,unit,fmt,reverse(越小越好),maN}
   */
  function num(v) { v = (typeof v === 'number') ? v : parseFloat(v); return isFinite(v) ? v : null; }
  function chartSVG(vals, opts) {
    opts = opts || {};
    vals = (vals || []).map(num);   // 防御：过滤掉非数字，避免画出 NaN
    var W = 640, H = 200, PL = 44, PR = 12, PT = 14, PB = 26;
    var iw = W - PL - PR, ih = H - PT - PB;
    var n = vals.length;
    var min = opts.min, max = opts.max;
    if (min == null || max == null) {
      var vs = vals.filter(function (v) { return v != null; });
      var lo = vs.length ? Math.min.apply(null, vs) : 0, hi = vs.length ? Math.max.apply(null, vs) : 1;
      if (min == null) min = Math.min(0, lo);
      if (max == null) max = Math.max(1, hi);
      var pad = (max - min) * 0.12 || 1;
      if (min == null) min -= pad; if (max == null) max += pad;
      if (opts.min == null) min = Math.floor(min); if (opts.max == null) max = Math.ceil(max);
    }
    var X = function (i) { return PL + (n <= 1 ? iw / 2 : iw * i / (n - 1)); };
    var Y = function (v) { return PT + ih * (1 - (v - min) / (max - min || 1)); };
    var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:200px;display:block">';
    // 网格 + Y 轴刻度
    for (var g = 0; g <= 4; g++) {
      var v = min + (max - min) * g / 4, y = Y(v);
      s += '<line x1="' + PL + '" y1="' + y.toFixed(1) + '" x2="' + (W - PR) + '" y2="' + y.toFixed(1) +
        '" stroke="#ece9e0" stroke-width="1"/>';
      s += '<text x="' + (PL - 6) + '" y="' + (y + 4).toFixed(1) + '" text-anchor="end" font-size="10" fill="#8a939d">' +
        (opts.fmt ? opts.fmt(v) : Math.round(v)) + '</text>';
    }
    // 原始折线（淡）
    var dRaw = '', started = false;
    for (var i = 0; i < n; i++) {
      if (vals[i] == null) { started = false; continue; }
      dRaw += (started ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(vals[i]).toFixed(1) + ' ';
      started = true;
    }
    if (dRaw) s += '<path d="' + dRaw + '" fill="none" stroke="' + (opts.color || '#c8892b') + '" stroke-width="1" opacity=".35"/>';
    // 移动平均（粗）
    var ma = movingAvg(vals, opts.maN || 5), dMa = ''; started = false;
    for (var k = 0; k < n; k++) {
      if (ma[k] == null) { started = false; continue; }
      dMa += (started ? 'L' : 'M') + X(k).toFixed(1) + ' ' + Y(ma[k]).toFixed(1) + ' ';
      started = true;
    }
    if (dMa) s += '<path d="' + dMa + '" fill="none" stroke="' + (opts.color || '#c8892b') + '" stroke-width="2.4" stroke-linejoin="round"/>';
    // 点
    for (var p = 0; p < n; p++) {
      if (vals[p] == null) continue;
      var col = opts.color || '#c8892b';
      s += '<circle cx="' + X(p).toFixed(1) + '" cy="' + Y(vals[p]).toFixed(1) + '" r="' + (n > 40 ? 1.8 : 3) +
        '" fill="' + col + '" opacity=".75"/>';
    }
    // X 轴
    s += '<line x1="' + PL + '" y1="' + (H - PB) + '" x2="' + (W - PR) + '" y2="' + (H - PB) + '" stroke="#dcd7c9"/>';
    var ticks = [1, Math.ceil(n / 2), n].filter(function (v, idx, arr) { return arr.indexOf(v) === idx && v >= 1; });
    for (var t = 0; t < ticks.length; t++) {
      var xi = X(ticks[t] - 1);
      s += '<text x="' + xi.toFixed(1) + '" y="' + (H - PB + 15) + '" text-anchor="middle" font-size="10" fill="#8a939d">第' + ticks[t] + '局</text>';
    }
    s += '</svg>';
    return s;
  }

  /** 依据历史生成某个指标的数据序列 */
  function metricSeries(hist, key) {
    var vals = [], cumWin = 0, cumScore = 0;
    for (var i = 0; i < hist.length; i++) {
      var h = hist[i];
      if (key === 'hit') {
        vals.push(h.first > 0 ? Math.round(h.firstHit / h.first * 100) : null);
      } else if (key === 'shanten') {
        vals.push(h.avgSh);
      } else if (key === 'winrate') {
        if (h.result === 'win') cumWin++;
        vals.push(Math.round(cumWin / (i + 1) * 100));
      } else if (key === 'score') {
        cumScore = h.score; vals.push(cumScore);
      } else if (key === 'fan') {
        vals.push(h.result === 'win' ? h.fan : 0);
      }
    }
    return vals;
  }

    var rate = s.discards ? Math.round(s.agree / s.discards * 100) : 0;
    var wr = s.games ? Math.round(s.wins / s.games * 100) : 0;
    var avgSh = s.shantenN ? (s.shantenSum / s.shantenN).toFixed(2) : '—';
    var firstRate = s.first ? Math.round(s.firstHit / s.first * 100) : 0;

    var h = '<div style="font-size:12px;color:#5b6570;margin-bottom:8px">' +
      '数据自动保存在<b>本机浏览器</b>（localStorage），关掉页面也不会丢。已记录 <b>' + hist.length + '</b> 局。' +
      (hist.length ? '' : '　打完第一局这里就会出现成长曲线。') + '</div>';

    h += '<div class="kv">' +
      '<div class="k">对局数</div><div>' + s.games + ' 局（胜率 ' + wr + '%）</div>' +
      '<div class="k">第一直觉命中率</div><div>' + (s.firstHit || 0) + ' / ' + (s.first || 0) + '（' + firstRate + '%）' +
      (firstRate >= 80 ? ' <span class="badge g">出师了</span>' : firstRate >= 60 ? ' <span class="badge y">还行</span>' : ' <span class="badge r">继续练</span>') + '</div>' +
      '<div class="k">最终采纳率</div><div>' + s.agree + ' / ' + s.discards + '（' + rate + '%）</div>' +
      '<div class="k">碰/杠判断命中率</div><div>' + (s.claimHit || 0) + ' / ' + (s.claimN || 0) +
      (s.claimN ? '（' + Math.round((s.claimHit || 0) / s.claimN * 100) + '%）' : '（还没做过碰/杠决策）') + '</div>' +
      '<div class="k">平均向听数</div><div>' + avgSh + '（越小越好）</div>' +
      '<div class="k">自摸 / 荒庄 / 最大番</div><div>' + s.wins + ' / ' + s.draws + ' / ' + s.bestFan + ' 番</div>' +
      '<div class="k">累计积分</div><div>' + myScoreHTML(s.totalScore || 0) +
      '　<button style="font-size:11px;padding:2px 8px" onclick="UI.resetScore()">重置分数</button></div>' +
      '</div>';

    if (hist.length >= 2) {
      var M = null;
      for (var mi = 0; mi < METRICS.length; mi++) if (METRICS[mi].k === _metric) M = METRICS[mi];
      var vals = metricSeries(hist, _metric);
      h += '<div class="sub-h" style="margin-top:16px">成长曲线</div>';
      // 指标切换
      h += '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px">';
      for (var mj = 0; mj < METRICS.length; mj++) {
        var mm = METRICS[mj];
        h += '<button class="segbtn" data-m="' + mm.k + '" style="padding:4px 10px;font-size:12px;border-radius:16px;' +
          (mm.k === _metric ? 'background:' + mm.color + ';color:#fff;border-color:' + mm.color + ';' : '') + '">' + mm.name + '</button>';
      }
      h += '</div>';
      h += '<div style="border:1px solid var(--line);border-radius:10px;padding:6px 4px;background:#fdfdfb">' +
        chartSVG(vals, { color: M.color, min: M.min, max: M.max, fmt: M.fmt, maN: Math.max(3, Math.min(7, Math.round(hist.length / 6))) }) + '</div>';
      h += '<div style="font-size:11.5px;color:#8a939d;margin-top:6px">' + M.desc +
        '　<span style="color:#c8892b">—</span> 粗线是 ' + Math.max(3, Math.min(7, Math.round(hist.length / 6))) + ' 局移动平均（看趋势用），细线和点是每局实际值。</div>';
      h += trendComment(hist);
    }

    h += '<div class="hint"><b>第一直觉命中率</b>才是你的真实水平 —— 统计的是你在看答案之前第一下点的牌对不对；' +
      '最终采纳率只说明你听不听劝。命中率稳定 80%+ 就出师了。</div>';

    UI.openModal('我的统计 · 成长曲线', h, [
      { t: '导出备份', f: 'UI.exportStat()' },
      { t: '导入', f: 'UI.importStat()' },
      { t: '清空', f: 'UI.clearStat()' },
      { t: '关闭', cls: 'primary', f: 'UI.closeModal()' }
    ]);

    var btns = $('mdBody').querySelectorAll('.segbtn');
    for (var bi = 0; bi < btns.length; bi++) {
      btns[bi].onclick = function () { _metric = this.getAttribute('data-m'); statModal(); };
    }
  }

  /** 前后段对比，给一句评价 */
  function trendComment(hist) {
    var half = Math.floor(hist.length / 2);
    if (half < 2) return '';
    function avg(arr, key) {
      var s = 0, c = 0;
      for (var i = 0; i < arr.length; i++) {
        var v = (key === 'hit') ? (arr[i].first ? arr[i].firstHit / arr[i].first * 100 : null)
          : (key === 'sh' ? arr[i].avgSh : null);
        if (v != null) { s += v; c++; }
      }
      return c ? s / c : null;
    }
    var a1 = hist.slice(0, half), a2 = hist.slice(half);
    var h1 = avg(a1, 'hit'), h2 = avg(a2, 'hit');
    var s1 = avg(a1, 'sh'), s2 = avg(a2, 'sh');
    if (h1 == null || h2 == null) return '';
    var dh = h2 - h1, ds = (s1 != null && s2 != null) ? s2 - s1 : 0;
    var txt, cls;
    if (dh >= 8) { txt = '明显进步'; cls = 'g'; }
    else if (dh >= 2) { txt = '稳步上升'; cls = 'g'; }
    else if (dh <= -8) { txt = '有所下滑'; cls = 'r'; }
    else if (dh <= -2) { txt = '略有回落'; cls = 'y'; }
    else { txt = '基本持平'; cls = 'y'; }
    return '<div class="hint" style="margin-top:10px">前后对比（前 ' + half + ' 局 → 后 ' + (hist.length - half) + ' 局）：' +
      '<span class="badge ' + cls + '">' + txt + '</span>　命中率 ' + h1.toFixed(0) + '% → ' + h2.toFixed(0) + '%' +
      (s1 != null && s2 != null ? '，平均向听 ' + s1.toFixed(2) + ' → ' + s2.toFixed(2) + (ds < -0.1 ? '（更快了）' : ds > 0.1 ? '（变慢了）' : '') : '') +
      '。</div>';
  }

  UI.clearStat = function () {
    if (!confirm('确定清空全部统计？\n（对局数、命中率、成长曲线、累计分数都会清空，且无法恢复）')) return;
    saveStat(defStat()); UI.closeModal(); toast('统计已清空');
  };
  /** 只清零累计分数，保留历史和命中率，方便重新开始计分但保留成长记录 */
  UI.resetScore = function () {
    var s = loadStat();
    if (!(s.totalScore)) { toast('当前累计积分本来就是 0'); return; }
    var shift = s.totalScore;
    s.totalScore = 0;
    // 把历史里所有点的"累计积分"都减去 shift，让成长曲线（score）从 0 重新开始，
    // 同时保留历史形状（每局的输赢量不变）；其它指标（命中率、向听、番数）不受影响
    if (Array.isArray(s.hist) && s.hist.length) {
      for (var i = 0; i < s.hist.length; i++) {
        if (typeof s.hist[i].score === 'number') s.hist[i].score -= shift;
        if (typeof s.hist[i].cum === 'number') s.hist[i].cum -= shift;
      }
    }
    saveStat(s);
    // 当前正在进行的这局玩家分数（G.players[0].score）也清零
    if (G && G.players && G.players[0]) G.players[0].score = 0;
    if (typeof render === 'function') render();   // 同步刷新主面板上的分数显示
    statModal();
    toast('累计积分已清零（历史与命中率保留），从下一局重新计分');
  };
  UI.exportStat = function () {
    var s = loadStat();
    var txt = JSON.stringify(s, null, 1);
    try {
      var blob = new Blob([txt], { type: 'application/json' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = '晃晃麻将统计_' + new Date().toISOString().slice(0, 10) + '.json';
      a.click();
      toast('已导出备份文件');
    } catch (e) {
      UI.openModal('统计备份数据（复制保存）', '<textarea style="width:100%;height:260px;font-size:12px">' + esc(txt) + '</textarea>',
        [{ t: '关闭', cls: 'primary', f: 'UI.closeModal()' }]);
    }
  };
  UI.importStat = function () {
    UI.openModal('导入统计备份',
      '<div style="font-size:13px;margin-bottom:8px">选择之前导出的 .json 备份文件（导入会<b>覆盖</b>当前记录）。</div>' +
      '<input type="file" id="statFile" accept=".json,application/json" style="font-size:13px">',
      [{ t: '开始导入', cls: 'primary', f: 'UI.doImport()' }, { t: '取消', f: 'UI.closeModal()' }]);
  };
  UI.doImport = function () {
    var f = document.getElementById('statFile');
    if (!f || !f.files || !f.files[0]) { toast('请先选择文件'); return; }
    var r = new FileReader();
    r.onload = function () {
      try {
        var d = JSON.parse(r.result);
        if (typeof d !== 'object' || d == null) throw new Error('bad');
        var base = defStat();
        for (var k in base) if (!(k in d)) d[k] = base[k];
        if (!Array.isArray(d.hist)) d.hist = [];
        saveStat(d);
        UI.closeModal(); statModal(); toast('已导入 ' + d.hist.length + ' 局记录');
      } catch (e) { toast('文件格式不对，导入失败'); }
    };
    r.readAsText(f.files[0]);
  };

  /* ---------------- 启动 ---------------- */
  window.__MJDBG = {
    get G() { return G; }, S: S,
    humanDiscard: humanDiscard, newGame: newGame, computeHint: computeHint,
    chartSVG: chartSVG, metricSeries: metricSeries, METRICS: METRICS, loadStat: loadStat,
    sameScore: sameScore, faceSVG: faceSVG
  };

  $('btnNew').onclick = function () { UI.newGame(); };
  $('btnRules').onclick = rulesModal;
  $('btnTut').onclick = tutModal;
  $('btnStat').onclick = statModal;
  $('mask').onclick = function (e) { if (e.target === $('mask')) UI.closeModal(); };

  /* ---------------- 托管（自动打牌） ---------------- */
  function refreshAutoBtns() {
    if (!$('btnAutoAll')) return;
    $('btnAutoAll').className = S.autoAll ? 'primary' : '';
    $('btnAutoTing').className = S.autoTing ? 'primary' : '';
    $('btnAutoAll').textContent = S.autoAll ? '● 全程托管中(点击停止)' : '全程托管';
    $('btnAutoTing').textContent = S.autoTing ? '● 听牌托管中(点击停止)' : '听牌托管';
  }
  function autoTick() {
    if (!G || G.players == null) return;
    var me = G.players[0];
    var full = !!S.autoAll;
    var ting = !!S.autoTing && !!me.ting;      // 听牌后托管：仅当前局且已听牌才动作
    if (!full && !ting) return;
    if (G.over) {
      if (full) {                               // 全程托管：结算后自动开下一局
        if (!autoTick._t) autoTick._t = Date.now();
        if (Date.now() - autoTick._t > 1600) { autoTick._t = 0; UI.closeModal(); newGame(); }
      }
      return;
    }
    autoTick._t = 0;
    if (G.turn === 0 && G.canWin) { UI.selfWin(); return; }          // 能胡就胡
    if (G.pending && G.pending.type === 'claim') {                    // 碰/杠/过决策
      var pd = G.pending;
      if (full) { var A = (S.coach !== 'off') ? claimAdvice() : null; UI.claim(A ? A.advice : 'pass'); }
      else if (pd.canKong) UI.claim('kong');
      else if (pd.canPung) UI.claim('pung');
      else UI.claim('pass');
      return;
    }
    if (G.turn === 0 && G.phase === 'discard') {                      // 轮到我出牌
      if (G.canKongList && G.canKongList.length) {                    // 能杠先杠
        var k = G.canKongList[0];
        if (full) { if (aiWantKong(me, k)) { UI.doKong(k.tile, k.kind); return; } }
        else { UI.doKong(k.tile, k.kind); return; }
      }
      if (full) { if (G.hint) UI.quickPlay(G.hint.best.discard); }    // 全程：按教练最优
      else UI.quickPlay(me.drawn != null ? me.drawn : (G.hint ? G.hint.best.discard : me.hand[0]));  // 听牌：摸什么打什么（开局无摸牌时按最优）
    }
  }
  if (typeof setInterval === 'function') {
    var __autoIv = setInterval(autoTick, 350);
    if (__autoIv && __autoIv.unref) __autoIv.unref();   // node 测试进程可正常退出；浏览器忽略
  }
  $('btnAutoAll').onclick = function () {
    S.autoAll = !S.autoAll;
    if (S.autoAll) S.autoTing = false;     // 两种托管互斥
    refreshAutoBtns();
    toast(S.autoAll ? '全程托管已开启：自动按教练打牌，打完自动开下一局' : '全程托管已停止', 2400);
  };
  $('btnAutoTing').onclick = function () {
    S.autoTing = !S.autoTing;
    if (S.autoTing) S.autoAll = false;     // 互斥
    refreshAutoBtns();
    toast(S.autoTing ? '听牌托管已开启（仅当前局）：听牌后摸什么打什么，直到胡/杠/碰' : '听牌托管已停止', 2400);
  };
  refreshAutoBtns();

  /* ---------- 整体缩放：牌桌+教练整体等比缩放进视口高度，保证浏览器不出现垂直滚动条 ---------- */
  function fitTable() {
    try {
      var inner = $('mainInner'), main = document.querySelector('main');
      if (!inner || !main || !(main.clientHeight > 0)) return;
      inner.style.zoom = '';
      var avail = main.clientHeight - 24;            /* 减去 main 上下 padding */
      var need = inner.offsetHeight;
      if (need > avail && avail > 300) inner.style.zoom = (avail / need).toFixed(4);
    } catch (e) { /* 无 DOM 环境时跳过 */ }
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('resize', fitTable);
    window.addEventListener('load', fitTable);
  }
  setTimeout(fitTable, 60);

  newGame();
  fitTable();
})();

</script>
</body>
</html>
